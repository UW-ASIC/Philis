# ponytail: zip shipped no Cargo.toml; minimal manifest inferred from the sources' deps
[package]
name = "gdsverify"
version = "0.1.0"
edition = "2021"

[features]
# CubeCL kernels (#[cube] Rust, compiled per-backend). CUDA runtime needs libcuda +
# libnvrtc at runtime; swap/add cubecl's "wgpu" feature for non-NVIDIA targets.
gpu = ["dep:cubecl", "cubecl/cuda"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
cubecl = { version = "0.10", optional = true }

[[bin]]
name = "conformance"
path = "conformance/conformance.rs"

[[bin]]
name = "generate_conformance"
path = "conformance/generator/generator.rs"

[[bin]]
name = "perf"
path = "conformance/perf.rs"
