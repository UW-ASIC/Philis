<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="random-area-title"><title id="random-area-title">Equal total area before and after splitting into four units</title><desc>One large device on the left and four smaller unit devices on the right occupy equal active area. Each smaller unit has larger individual local variation, and averaging four independent units recovers the original area result.</desc><rect x="10" y="10" width="780" height="340" rx="12" fill="#f5f8fc" stroke="#ccd4df"/><text x="42" y="48" font-size="20" fill="#17314a">One device: total area A</text><rect x="65" y="75" width="230" height="150" fill="#d2e5f6" stroke="#27618c" stroke-width="3"/><text x="133" y="157" font-size="22" fill="#17314a">area A</text><text x="42" y="263" font-size="17" fill="#17314a">Local σ proportional to 1/√A</text><text x="430" y="48" font-size="20" fill="#17314a">Four equal units: total area A</text><g fill="#d2e5f6" stroke="#27618c" stroke-width="3"><rect x="435" y="75" width="115" height="75"/><rect x="575" y="75" width="115" height="75"/><rect x="435" y="170" width="115" height="75"/><rect x="575" y="170" width="115" height="75"/></g><g font-size="19" fill="#17314a"><text x="472" y="120">A/4</text><text x="612" y="120">A/4</text><text x="472" y="215">A/4</text><text x="612" y="215">A/4</text></g><text x="410" y="285" font-size="16" fill="#17314a">Each unit has 2σ; four-unit average has σ.</text><text x="40" y="325" font-size="16" fill="#364b60">Blue = active device area. Gaps, contacts, and routing consume additional footprint.</text></svg>
