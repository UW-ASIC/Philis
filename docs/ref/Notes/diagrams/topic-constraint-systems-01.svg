<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="cs-provenance-title"><title id="cs-provenance-title">Traceable lowering of an electrical requirement</title><desc>A voltage-drop specification and branch-current model derive a resistance allowance. Via resistance and a sheet-resistance model derive a wire-length screening cap. Extraction returns evidence to the original requirement.</desc><rect width="800" height="370" fill="#f8fafc"/><rect x="25" y="25" width="230" height="78" fill="#e0e7ff" stroke="#4f46e5"/><text x="43" y="57" font-size="18">Drop ≤ 2 mV</text><text x="43" y="86" font-size="16">at specified branch current</text><rect x="300" y="25" width="210" height="78" fill="#bfdbfe" stroke="#2563eb"/><text x="319" y="57" font-size="18">I = 100 µA</text><text x="319" y="86" font-size="16">scenario + analysis revision</text><path d="M140 103 V143 H405 V103" stroke="#334155" stroke-width="2" fill="none"/><rect x="174" y="162" width="252" height="70" fill="#a7f3d0" stroke="#059669"/><text x="194" y="190" font-size="18">Rtotal ≤ 20 Ω</text><text x="194" y="218" font-size="16">4 Ω via → 16 Ω wire</text><path d="M300 143 V162 M426 197 H477" stroke="#334155" stroke-width="2" fill="none"/><rect x="480" y="162" width="289" height="70" fill="#fde68a" stroke="#ca8a04"/><text x="498" y="190" font-size="18">Lwire ≤ 80 µm</text><text x="498" y="218" font-size="16">only for chosen layer and width</text><rect x="260" y="286" width="340" height="60" fill="#fff" stroke="#64748b"/><text x="279" y="322" font-size="18">Extracted branch → verify actual drop</text><path d="M625 232 V316 H600 M260 316 H70 V103" stroke="#7c3aed" stroke-width="2" fill="none"/><text x="630" y="279" font-size="15" fill="#7c3aed">evidence</text></svg>
