<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="root-performance-loop-title" aria-describedby="root-performance-loop-desc" font-family="system-ui, sans-serif"><title id="root-performance-loop-title">Use circuit failures to guide the next physical proposal</title><desc id="root-performance-loop-desc">A closed loop goes from layout choices to extraction to circuit metrics and then to updated budgets with a model validity check.</desc><text x="24" y="32" font-size="20" text-anchor="start" fill="#20343b">Use circuit failures to guide the next physical proposal</text><rect x="40" y="83" width="220" height="73" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="150.0" y="114.5" font-size="16" text-anchor="middle" fill="#20343b">Layout choices</text><text x="150.0" y="136.5" font-size="16" text-anchor="middle" fill="#20343b">units / topology / widths</text><line x1="260" y1="119" x2="306" y2="119" stroke="#20343b" stroke-width="2"/><polygon points="306.0,119.0 297.0,123.3 297.0,114.7" fill="#20343b"/><rect x="309" y="83" width="198" height="73" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="408.0" y="114.5" font-size="16" text-anchor="middle" fill="#20343b">Draw + verify</text><text x="408.0" y="136.5" font-size="16" text-anchor="middle" fill="#20343b">extract terminal RC</text><line x1="507" y1="119" x2="550" y2="119" stroke="#20343b" stroke-width="2"/><polygon points="550.0,119.0 541.0,123.3 541.0,114.7" fill="#20343b"/><rect x="553" y="83" width="208" height="73" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="657.0" y="114.5" font-size="16" text-anchor="middle" fill="#20343b">Circuit metrics</text><text x="657.0" y="136.5" font-size="16" text-anchor="middle" fill="#20343b">required scenarios</text><line x1="658" y1="156" x2="658" y2="235" stroke="#20343b" stroke-width="2"/><polygon points="658.0,235.0 653.7,226.0 662.3,226.0" fill="#20343b"/><rect x="540" y="238" width="220" height="78" fill="#ffe6ad" stroke="#20343b" stroke-width="1.5"/><text x="650.0" y="272.0" font-size="16" text-anchor="middle" fill="#20343b">Margins + evidence</text><text x="650.0" y="294.0" font-size="16" text-anchor="middle" fill="#20343b">feasible archive</text><line x1="540" y1="277" x2="496" y2="277" stroke="#20343b" stroke-width="2"/><polygon points="496.0,277.0 505.0,272.7 505.0,281.3" fill="#20343b"/><rect x="283" y="238" width="211" height="78" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="388.5" y="272.0" font-size="16" text-anchor="middle" fill="#20343b">Sensitivities / model</text><text x="388.5" y="294.0" font-size="16" text-anchor="middle" fill="#20343b">within valid domain</text><line x1="283" y1="277" x2="152" y2="277" stroke="#20343b" stroke-width="2"/><polygon points="152.0,277.0 161.0,272.7 161.0,281.3" fill="#20343b"/><line x1="152" y1="277" x2="152" y2="158" stroke="#20343b" stroke-width="2"/><polygon points="152.0,158.0 156.3,167.0 147.7,167.0" fill="#20343b"/><text x="35" y="374" font-size="17" text-anchor="start" fill="#20343b">Unknown or out-of-domain predictions need evaluation, not a pass label.</text></svg>
