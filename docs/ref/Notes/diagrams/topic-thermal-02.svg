<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="thermal-feedback-title"><title id="thermal-feedback-title">Electrical and thermal feedback loop with package boundary</title><desc>Rectangular blocks represent electrical current and voltage solution, dissipated power, the die and package thermal solution, and temperature-dependent device and interconnect models. Arrows form an iterative loop.</desc><rect x="10" y="10" width="780" height="340" rx="12" fill="#f7fafc" stroke="#cbd5df"/><text x="28" y="42" font-size="20" fill="#17314a">A geometry change requires electrical and thermal re-evaluation</text><g stroke-width="2"><rect x="45" y="80" width="275" height="76" fill="#c8dff2" stroke="#32658e"/><rect x="478" y="80" width="275" height="76" fill="#f1d0b8" stroke="#9b6840"/><rect x="478" y="224" width="275" height="77" fill="#ead0c3" stroke="#9a604a"/><rect x="45" y="224" width="275" height="77" fill="#d1e2d4" stroke="#537c5a"/></g><g fill="#17314a" font-size="18"><text x="71" y="111">Circuit / route solution</text><text x="70" y="140">I(t), V(t), operating mode</text><text x="510" y="111">Dissipated power</text><text x="510" y="140">device loss and I²R</text><text x="502" y="255">Die + package heat flow</text><text x="502" y="284">T(r,t), boundary conditions</text><text x="65" y="255">Temperature-dependent</text><text x="65" y="284">resistance, bias, EM limits</text></g><g stroke="#526c82" stroke-width="3" fill="none"><line x1="323" y1="118" x2="466" y2="118"/><line x1="615" y1="160" x2="615" y2="213"/><line x1="471" y1="262" x2="331" y2="262"/><line x1="182" y1="217" x2="182" y2="166"/></g><g font-size="26" fill="#526c82"><text x="450" y="126">→</text><text x="605" y="207">↓</text><text x="327" y="270">←</text><text x="172" y="186">↑</text></g><text x="33" y="332" font-size="16" fill="#17314a">Convergence requires a physical model, numerical tolerances, and mode consistency.</text></svg>
