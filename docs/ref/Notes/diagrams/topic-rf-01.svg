<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="topic-rf-fig-1"><title id="topic-rf-fig-1">An integrated inductor includes its leads and electromagnetic environment</title><desc>A rectangular blue spiral has an inner terminal brought out by a red crossover. A green exclusion boundary surrounds the spiral, and the diagram highlights that nearby fill, shields and return conductors change its extracted model.</desc><text x="45" y="30" font-family="system-ui, sans-serif" font-size="19" fill="#172033" text-anchor="start">Winding, crossover, nearby materials and return define the RF device</text><rect x="75" y="56" width="435" height="300" rx="0" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><polyline points="115,93 449,93 449,307 160,307 160,135 404,135 404,263 207,263 207,179 357,179 357,220 270,220" fill="none" stroke="#2563eb" stroke-width="14" stroke-linejoin="miter"/><line x1="270" y1="220" x2="548" y2="220" stroke="#dc2626" stroke-width="9"/><rect x="262" y="212" width="16" height="16" rx="0" fill="#64748b" stroke="#334155" stroke-width="2"/><text x="88" y="82" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">P1</text><text x="550" y="225" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">P2</text><text x="545" y="86" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Blue = winding</text><text x="545" y="117" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Red = crossover</text><text x="545" y="151" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Green = exclusion</text><text x="545" y="269" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Include both ports,</text><text x="545" y="295" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">return geometry</text><text x="545" y="321" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">and substrate model.</text><text x="92" y="385" font-family="system-ui, sans-serif" font-size="17" fill="#172033" text-anchor="start">More turns add L, R and C; their combined frequency response decides value.</text></svg>
