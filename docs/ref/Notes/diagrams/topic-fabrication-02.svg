<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-fabrication-fig-2"><title id="topic-fabrication-fig-2">Identical printed shapes need comparable surroundings</title><desc>Two purple gate rectangles have equal drawn width but different neighbor distances. A lower comparison surrounds every active gate with equal-pitch dummy neighbors.</desc><text x="60" y="35" font-family="system-ui, sans-serif" font-size="19" fill="#172033" text-anchor="start">Equal drawn dimensions can face unequal processing environments</text><rect x="120" y="70" width="35" height="90" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><rect x="180" y="70" width="35" height="90" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><rect x="460" y="70" width="35" height="90" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><text x="118" y="183" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Dense pair</text><text x="430" y="183" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Isolated gate</text><line x1="215" y1="118" x2="450" y2="118" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/><text x="270" y="103" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Different open area</text><text x="60" y="223" font-family="system-ui, sans-serif" font-size="18" fill="#172033" text-anchor="start">A repeatable boundary environment reduces a source of systematic error</text><rect x="110" y="250" width="35" height="70" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><rect x="175" y="250" width="35" height="70" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><rect x="240" y="250" width="35" height="70" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><rect x="305" y="250" width="35" height="70" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="400" y="273" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Gray units = qualified dummies</text><text x="400" y="303" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Equal pitch; controlled end context</text></svg>
