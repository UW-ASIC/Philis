<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="topic-floorplanning-fig-2"><title id="topic-floorplanning-fig-2">A routing channel is consumed by more than minimum-width wires</title><desc>A channel between two macros contains wide power and return conductors, a shield beside a sensitive route, and a large via access area. Dashed tracks illustrate how a simplistic pitch count overestimates freely available capacity.</desc><text x="45" y="33" font-family="system-ui, sans-serif" font-size="19" fill="#172033" text-anchor="start">Reserve wide nets, shields and access before ordinary signal tracks</text><rect x="45" y="75" width="190" height="214" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><rect x="565" y="75" width="190" height="214" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="140" y="182" font-family="system-ui, sans-serif" font-size="20" fill="#172033" text-anchor="middle">Macro A</text><text x="660" y="182" font-family="system-ui, sans-serif" font-size="20" fill="#172033" text-anchor="middle">Macro B</text><rect x="260" y="70" width="38" height="230" rx="0" fill="#fecaca" stroke="#334155" stroke-width="2"/><rect x="320" y="70" width="32" height="230" rx="0" fill="#94a3b8" stroke="#334155" stroke-width="2"/><rect x="390" y="70" width="12" height="230" rx="0" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="419" y="70" width="12" height="230" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><line x1="465" y1="70" x2="465" y2="300" stroke="#2563eb" stroke-width="5"/><line x1="499" y1="70" x2="499" y2="300" stroke="#2563eb" stroke-width="5"/><rect x="469" y="172" width="75" height="66" rx="0" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><rect x="482" y="185" width="18" height="18" rx="0" fill="#64748b" stroke="#334155" stroke-width="2"/><rect x="510" y="185" width="18" height="18" rx="0" fill="#64748b" stroke="#334155" stroke-width="2"/><text x="262" y="327" font-family="system-ui, sans-serif" font-size="14" fill="#172033" text-anchor="start">PWR</text><text x="316" y="350" font-family="system-ui, sans-serif" font-size="14" fill="#172033" text-anchor="start">Return</text><text x="367" y="327" font-family="system-ui, sans-serif" font-size="14" fill="#172033" text-anchor="start">Shield</text><text x="408" y="350" font-family="system-ui, sans-serif" font-size="14" fill="#172033" text-anchor="start">Sense</text><text x="499" y="263" font-family="system-ui, sans-serif" font-size="14" fill="#172033" text-anchor="middle">Via access</text><line x1="235" y1="110" x2="565" y2="110" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5"/></svg>
