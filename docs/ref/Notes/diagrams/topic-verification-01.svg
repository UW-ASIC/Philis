<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" role="img" aria-labelledby="root-verification-chain-title" aria-describedby="root-verification-chain-desc" font-family="system-ui, sans-serif"><title id="root-verification-chain-title">A certificate needs every required evidence layer</title><desc id="root-verification-chain-desc">A stack of paired rectangles identifies circuit/geometry, physical checks, extraction/performance and coverage/provenance dependencies.</desc><text x="24" y="32" font-size="20" text-anchor="start" fill="#20343b">A certificate needs every required evidence layer</text><rect x="32" y="65" width="225" height="57" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="144.5" y="99.5" font-size="16" text-anchor="middle" fill="#20343b">Circuit identity</text><line x1="257" y1="93" x2="307" y2="93" stroke="#20343b" stroke-width="2"/><polygon points="307.0,93.0 298.0,97.3 298.0,88.7" fill="#20343b"/><rect x="309" y="65" width="456" height="57" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="537.0" y="99.5" font-size="16" text-anchor="middle" fill="#20343b">terminals + recognized devices</text><line x1="537" y1="122" x2="537" y2="147" stroke="#20343b" stroke-width="2"/><polygon points="537.0,147.0 532.7,138.0 541.3,138.0" fill="#20343b"/><rect x="32" y="149" width="225" height="57" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="144.5" y="183.5" font-size="16" text-anchor="middle" fill="#20343b">Physical legality</text><line x1="257" y1="177" x2="307" y2="177" stroke="#20343b" stroke-width="2"/><polygon points="307.0,177.0 298.0,181.3 298.0,172.7" fill="#20343b"/><rect x="309" y="149" width="456" height="57" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="537.0" y="183.5" font-size="16" text-anchor="middle" fill="#20343b">drawn geometry + process rules</text><line x1="537" y1="206" x2="537" y2="231" stroke="#20343b" stroke-width="2"/><polygon points="537.0,231.0 532.7,222.0 541.3,222.0" fill="#20343b"/><rect x="32" y="233" width="225" height="57" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="144.5" y="267.5" font-size="16" text-anchor="middle" fill="#20343b">Electrical behavior</text><line x1="257" y1="261" x2="307" y2="261" stroke="#20343b" stroke-width="2"/><polygon points="307.0,261.0 298.0,265.3 298.0,256.7" fill="#20343b"/><rect x="309" y="233" width="456" height="57" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="537.0" y="267.5" font-size="16" text-anchor="middle" fill="#20343b">PEX + scenarios + required metrics</text><line x1="537" y1="290" x2="537" y2="315" stroke="#20343b" stroke-width="2"/><polygon points="537.0,315.0 532.7,306.0 541.3,306.0" fill="#20343b"/><rect x="32" y="317" width="225" height="57" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="144.5" y="351.5" font-size="16" text-anchor="middle" fill="#20343b">Final certificate</text><line x1="257" y1="345" x2="307" y2="345" stroke="#20343b" stroke-width="2"/><polygon points="307.0,345.0 298.0,349.3 298.0,340.7" fill="#20343b"/><rect x="309" y="317" width="456" height="57" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="537.0" y="351.5" font-size="16" text-anchor="middle" fill="#20343b">coverage + margins + versions</text><text x="35" y="414" font-size="16" text-anchor="start" fill="#20343b">Missing required evidence blocks that claim; it does not become zero error.</text></svg>
