<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-mos-layout-fig-2"><title id="topic-mos-layout-fig-2">Dummies and active extension change the transistor environment</title><desc>An amber well encloses a green active stripe crossed by purple gates. Gray dummy gates and extra active length separate the outer active gates from the active edge. The distances to the well boundary and active edge are separate quantities.</desc><rect x="65" y="65" width="665" height="235" rx="0" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="82" y="89" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Well boundary</text><rect x="120" y="135" width="555" height="105" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><rect x="150" y="115" width="25" height="145" rx="0" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="245" y="115" width="25" height="145" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><rect x="340" y="115" width="25" height="145" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><rect x="435" y="115" width="25" height="145" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><rect x="550" y="115" width="25" height="145" rx="0" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><text x="140" y="286" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Dummy</text><text x="275" y="286" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Active gates</text><text x="540" y="286" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Dummy</text><line x1="66" y1="105" x2="245" y2="105" stroke="#b45309" stroke-width="3"/><text x="80" y="48" font-family="system-ui, sans-serif" font-size="19" fill="#172033" text-anchor="start">Well-edge context ≠ diffusion-edge context</text><line x1="462" y1="225" x2="675" y2="225" stroke="#166534" stroke-width="4"/><text x="467" y="210" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Active extension</text><text x="63" y="337" font-family="system-ui, sans-serif" font-size="17" fill="#172033" text-anchor="start">Purple = active gates   Gray = dummy gates   Green = active diffusion</text></svg>
