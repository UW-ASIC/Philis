<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-bipolar-diodes-fig-2"><title id="topic-bipolar-diodes-fig-2">A collecting guard must intercept the carrier path</title><desc>An electron injector lies between cross-sections of a reverse-biased collecting ring in a P-type substrate. One trajectory reaches the ring while a deeper dashed trajectory passes underneath toward a victim.</desc><text x="45" y="35" font-family="system-ui, sans-serif" font-size="19" fill="#172033" text-anchor="start">Top-view enclosure alone does not prove three-dimensional collection</text><rect x="60" y="115" width="680" height="155" rx="0" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="78" y="249" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">P-type substrate or epitaxial region</text><rect x="150" y="105" width="75" height="80" rx="0" fill="#fef3c7" stroke="#334155" stroke-width="2"/><rect x="385" y="105" width="75" height="80" rx="0" fill="#fef3c7" stroke="#334155" stroke-width="2"/><rect x="280" y="104" width="55" height="30" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><text x="275" y="82" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Injector</text><rect x="615" y="105" width="65" height="40" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><text x="610" y="83" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Victim</text><text x="95" y="300" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Amber = two cuts through one collecting ring</text><line x1="335" y1="155" x2="385" y2="155" stroke="#dc2626" stroke-width="4"/><text x="263" y="197" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Collected path</text><line x1="312" y1="214" x2="633" y2="214" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5"/><line x1="633" y1="214" x2="650" y2="155" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5"/><text x="425" y="329" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Deep bypass depends on stack and bias</text><rect x="166" y="75" width="25" height="30" rx="0" fill="#64748b" stroke="#334155" stroke-width="2"/><rect x="409" y="75" width="25" height="30" rx="0" fill="#64748b" stroke="#334155" stroke-width="2"/></svg>
