<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-resistors-fig-2"><title id="topic-resistors-fig-2">A Kelvin connection separates force and sense at the intended boundary</title><desc>A central resistor has thick blue force paths reaching its terminals and thin purple sense paths joining at those terminals. Dashed red alternative junctions lie too far away and would include force-wire resistance.</desc><text x="50" y="34" font-family="system-ui, sans-serif" font-size="19" fill="#172033" text-anchor="start">Sense the device terminals, not an arbitrary point on the power wire</text><rect x="295" y="145" width="210" height="60" rx="0" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="349" y="182" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Resistor</text><line x1="90" y1="175" x2="295" y2="175" stroke="#2563eb" stroke-width="15"/><line x1="505" y1="175" x2="715" y2="175" stroke="#2563eb" stroke-width="15"/><line x1="296" y1="145" x2="296" y2="85" stroke="#9333ea" stroke-width="4"/><line x1="296" y1="85" x2="110" y2="85" stroke="#9333ea" stroke-width="4"/><line x1="505" y1="145" x2="505" y2="85" stroke="#9333ea" stroke-width="4"/><line x1="505" y1="85" x2="688" y2="85" stroke="#9333ea" stroke-width="4"/><text x="66" y="65" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Sense +</text><text x="633" y="65" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Sense −</text><text x="73" y="224" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Force +</text><text x="638" y="224" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Force −</text><line x1="190" y1="178" x2="190" y2="260" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4"/><line x1="609" y1="178" x2="609" y2="260" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4"/><text x="101" y="294" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Joining here adds wire drop</text><text x="478" y="294" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Joining here adds wire drop</text></svg>
