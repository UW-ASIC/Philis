<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="root-shield-return-title" aria-describedby="root-shield-return-desc" font-family="system-ui, sans-serif"><title id="root-shield-return-title">A shield needs a quiet electrical return</title><desc id="root-shield-return-desc">An aggressor and victim rectangle are separated by a shield. Coupling to the shield and its return impedance remain part of the network.</desc><text x="24" y="32" font-size="20" text-anchor="start" fill="#20343b">A shield needs a quiet electrical return</text><rect x="47" y="90" width="605" height="38" fill="#f5d5ce" stroke="#20343b" stroke-width="1.5"/><text x="349.5" y="115.0" font-size="16" text-anchor="middle" fill="#20343b">Aggressor: switching voltage</text><rect x="47" y="190" width="605" height="32" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="349.5" y="212.0" font-size="16" text-anchor="middle" fill="#20343b">Shield conductor</text><rect x="47" y="292" width="605" height="38" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="349.5" y="317.0" font-size="16" text-anchor="middle" fill="#20343b">Victim: sensitive node</text><line x1="210" y1="131" x2="210" y2="186" stroke="#20343b" stroke-width="2"/><polygon points="210.0,186.0 205.7,177.0 214.3,177.0" fill="#20343b"/><text x="230" y="163" font-size="16" text-anchor="start" fill="#20343b">Coupling to shield</text><line x1="210" y1="225" x2="210" y2="287" stroke="#20343b" stroke-width="2"/><polygon points="210.0,287.0 205.7,278.0 214.3,278.0" fill="#20343b"/><text x="230" y="263" font-size="16" text-anchor="start" fill="#20343b">Added victim loading</text><line x1="652" y1="206" x2="720" y2="206" stroke="#20343b" stroke-width="2"/><text x="646" y="65" font-size="14" text-anchor="start" fill="#20343b">Quiet reference</text><line x1="720" y1="71" x2="720" y2="85" stroke="#20343b" stroke-width="2"/><rect x="676" y="85" width="88" height="70" fill="#ffe6ad" stroke="#20343b" stroke-width="1.5"/><text x="720.0" y="115.0" font-size="16" text-anchor="middle" fill="#20343b">Return</text><text x="720.0" y="137.0" font-size="16" text-anchor="middle" fill="#20343b">Z(f)</text><line x1="720" y1="155" x2="720" y2="206" stroke="#20343b" stroke-width="2"/><text x="41" y="380" font-size="17" text-anchor="start" fill="#20343b">Evaluate the shield voltage and return path as well as physical coverage.</text></svg>
