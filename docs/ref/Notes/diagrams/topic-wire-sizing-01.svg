<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="root-width-options-title" aria-describedby="root-width-options-desc" font-family="system-ui, sans-serif"><title id="root-width-options-title">Selective width is an electrical design decision</title><desc id="root-width-options-desc">Three route widths trade resistance against capacitance and consumed channel space. A driver-resistance model can have an interior optimum.</desc><text x="24" y="32" font-size="20" text-anchor="start" fill="#20343b">Selective width is an electrical design decision</text><rect x="44" y="95" width="420" height="10" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="495" y="106.0" font-size="18" text-anchor="start" fill="#20343b">Narrow</text><text x="44" y="134" font-size="16" text-anchor="start" fill="#20343b">higher R, smaller area load</text><rect x="44" y="180" width="420" height="22" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="495" y="197.0" font-size="18" text-anchor="start" fill="#20343b">Medium</text><text x="44" y="231" font-size="16" text-anchor="start" fill="#20343b">a possible compromise</text><rect x="44" y="280" width="420" height="42" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="495" y="307.0" font-size="18" text-anchor="start" fill="#20343b">Wide</text><text x="44" y="351" font-size="16" text-anchor="start" fill="#20343b">lower R, larger area load</text><text x="35" y="378" font-size="18" text-anchor="start" fill="#20343b">Legal widths + node sensitivity + via capacity + routing space</text></svg>
