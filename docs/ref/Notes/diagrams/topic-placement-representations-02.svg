<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 335" role="img" aria-labelledby="pr-island-title"><title id="pr-island-title">Symmetry island and hierarchical physical boundary</title><desc>Two pairs and one central module form a mirrored island. Its enclosing boundary includes an access and well margin. A parent-level box consumes that boundary rather than only active devices.</desc><rect width="800" height="335" fill="#f8fafc"/><rect x="35" y="45" width="425" height="235" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="7 4"/><line x1="247" y1="32" x2="247" y2="291" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/><rect x="85" y="95" width="105" height="65" fill="#bfdbfe" stroke="#2563eb"/><rect x="304" y="95" width="105" height="65" fill="#bfdbfe" stroke="#2563eb"/><rect x="85" y="175" width="105" height="65" fill="#a7f3d0" stroke="#059669"/><rect x="304" y="175" width="105" height="65" fill="#a7f3d0" stroke="#059669"/><rect x="190" y="135" width="114" height="85" fill="#fde68a" stroke="#ca8a04"/><text x="119" y="135" font-size="18">A</text><text x="337" y="135" font-size="18">A′</text><text x="121" y="214" font-size="18">B</text><text x="337" y="214" font-size="18">B′</text><text x="220" y="184" font-size="17">self</text><text x="52" y="72" font-size="15" fill="#334155">Include well / access / isolation boundary</text><path d="M474 163 L530 163" stroke="#334155" stroke-width="3"/><path d="M520 155 L532 163 L520 171" stroke="#334155" fill="none" stroke-width="3"/><rect x="550" y="95" width="200" height="150" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="574" y="150" font-size="18">Parent-level module</text><text x="572" y="179" font-size="16">outline + pin access</text><text x="581" y="207" font-size="16">+ inherited intent</text><text x="45" y="317" font-size="15" fill="#334155">Conceptual mirrored group; adjacency and PDK details must be generated explicitly.</text></svg>
