<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 365" role="img" aria-labelledby="ls-variants-title"><title id="ls-variants-title">A larger template can produce a better routed circuit</title><desc>The smaller cell has an output pin on the far side and a long route to the load. A slightly wider cell exposes its output near the load and uses a shorter route. Numerical capacitance and pole results are shown.</desc><rect width="800" height="365" fill="#f8fafc"/><text x="25" y="35" font-size="19">A: compact cell, costly output access</text><rect x="60" y="75" width="165" height="105" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="52" y="116" width="15" height="23" fill="#dc2626"/><rect x="312" y="109" width="57" height="60" fill="#e2e8f0" stroke="#64748b"/><path d="M58 126 H30 V220 H340 V169" fill="none" stroke="#dc2626" stroke-width="5"/><text x="98" y="135" font-size="20">72 µm²</text><text x="316" y="145" font-size="15">load</text><text x="48" y="266" font-size="17">Croute = 95 fF</text><text x="48" y="295" font-size="17">fp ≈ 54.9 MHz</text><text x="48" y="329" font-size="17" fill="#b91c1c">Fails 70 MHz screening target</text><text x="420" y="35" font-size="19">B: larger cell, useful output access</text><rect x="431" y="75" width="194" height="105" fill="#a7f3d0" stroke="#059669" stroke-width="2"/><rect x="618" y="116" width="15" height="23" fill="#059669"/><rect x="707" y="109" width="57" height="60" fill="#e2e8f0" stroke="#64748b"/><path d="M632 127 H706" fill="none" stroke="#059669" stroke-width="5"/><text x="485" y="135" font-size="20">84 µm²</text><text x="711" y="145" font-size="15">load</text><text x="432" y="266" font-size="17">Croute = 40 fF</text><text x="432" y="295" font-size="17">fp ≈ 88.4 MHz</text><text x="432" y="329" font-size="17" fill="#047857">Passes this local model</text></svg>
