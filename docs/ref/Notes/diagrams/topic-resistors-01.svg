<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-resistors-fig-1"><title id="topic-resistors-fig-1">Thermoelectric voltage depends on how strips are connected</title><desc>Four resistor strips have cold upper contacts and hot lower contacts. Same-direction traversal accumulates four contact-temperature voltages. Alternating traversal pairs positive and negative contributions.</desc><text x="45" y="32" font-family="system-ui, sans-serif" font-size="21" fill="#172033" text-anchor="start">Same physical strips; different electrical sum</text><text x="50" y="68" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Cold ends</text><text x="50" y="281" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Hot ends</text><rect x="170" y="94" width="35" height="150" rx="0" fill="#fde68a" stroke="#334155" stroke-width="2"/><rect x="235" y="94" width="35" height="150" rx="0" fill="#fde68a" stroke="#334155" stroke-width="2"/><rect x="300" y="94" width="35" height="150" rx="0" fill="#fde68a" stroke="#334155" stroke-width="2"/><rect x="365" y="94" width="35" height="150" rx="0" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="179" y="83" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">+</text><text x="244" y="83" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">+</text><text x="309" y="83" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">+</text><text x="374" y="83" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">+</text><text x="466" y="115" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">All traversed top to bottom:</text><text x="466" y="148" font-family="system-ui, sans-serif" font-size="20" fill="#b91c1c" text-anchor="start">E + E + E + E = 4E</text><text x="466" y="202" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Alternate traversal:</text><text x="466" y="235" font-family="system-ui, sans-serif" font-size="20" fill="#166534" text-anchor="start">E − E + E − E = 0</text><line x1="187" y1="244" x2="253" y2="244" stroke="#2563eb" stroke-width="5"/><line x1="253" y1="94" x2="317" y2="94" stroke="#2563eb" stroke-width="5"/><line x1="317" y1="244" x2="382" y2="244" stroke="#2563eb" stroke-width="5"/><text x="159" y="324" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Blue jumpers illustrate alternating series direction</text></svg>
