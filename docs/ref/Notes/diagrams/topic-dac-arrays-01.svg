<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="root-dac-topology-title" aria-describedby="root-dac-topology-desc" font-family="system-ui, sans-serif"><title id="root-dac-topology-title">Binary and split DACs have different top-plate graphs</title><desc id="root-dac-topology-desc">A binary bank has one common top node. A split bank has two top nodes connected only through the attenuation capacitor.</desc><text x="24" y="32" font-size="20" text-anchor="start" fill="#20343b">Binary and split DACs have different top-plate graphs</text><text x="30" y="76" font-size="18" text-anchor="start" fill="#20343b">Binary bank</text><rect x="40" y="107" width="255" height="77" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="167.5" y="140.5" font-size="16" text-anchor="middle" fill="#20343b">Bit capacitors</text><text x="167.5" y="162.5" font-size="16" text-anchor="middle" fill="#20343b">+ electrical dummy</text><line x1="295" y1="145" x2="372" y2="145" stroke="#20343b" stroke-width="2"/><rect x="374" y="116" width="170" height="58" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="459.0" y="140.0" font-size="16" text-anchor="middle" fill="#20343b">Common top</text><text x="459.0" y="162.0" font-size="16" text-anchor="middle" fill="#20343b">node</text><text x="30" y="231" font-size="18" text-anchor="start" fill="#20343b">Split bank</text><rect x="35" y="276" width="170" height="66" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="120.0" y="304.0" font-size="16" text-anchor="middle" fill="#20343b">LSB bank</text><text x="120.0" y="326.0" font-size="16" text-anchor="middle" fill="#20343b">top node L</text><line x1="205" y1="309" x2="295" y2="309" stroke="#20343b" stroke-width="2"/><rect x="295" y="276" width="183" height="66" fill="#ffe6ad" stroke="#20343b" stroke-width="1.5"/><text x="386.5" y="304.0" font-size="16" text-anchor="middle" fill="#20343b">Attenuation</text><text x="386.5" y="326.0" font-size="16" text-anchor="middle" fill="#20343b">capacitor</text><line x1="478" y1="309" x2="574" y2="309" stroke="#20343b" stroke-width="2"/><rect x="574" y="276" width="184" height="66" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="666.0" y="304.0" font-size="16" text-anchor="middle" fill="#20343b">MSB bank</text><text x="666.0" y="326.0" font-size="16" text-anchor="middle" fill="#20343b">top node M</text><text x="35" y="391" font-size="17" text-anchor="start" fill="#20343b">L and M are distinct nodes; routing them together destroys attenuation.</text></svg>
