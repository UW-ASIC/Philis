<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-manufacturability-fig-2"><title id="topic-manufacturability-fig-2">A density window can conflict with precision-device surroundings</title><desc>Two rectangular density windows contain blue metal fill. A green sensitive block in the left window has an exclusion boundary. The right shows fill redistributed in a controlled symmetric pattern around a sensitive block.</desc><text x="65" y="30" font-family="system-ui, sans-serif" font-size="21" fill="#172033" text-anchor="start">Final fill is a constrained part of the design</text><rect x="65" y="60" width="300" height="230" rx="0" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="430" y="60" width="300" height="230" rx="0" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="155" y="131" width="120" height="83" rx="0" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="518" y="131" width="120" height="83" rx="0" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="137" y="110" width="157" height="126" rx="0" fill="none" stroke="#b45309" stroke-width="2"/><text x="164" y="166" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Sensitive</text><text x="174" y="189" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">macro</text><text x="526" y="166" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Sensitive</text><text x="538" y="189" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">macro</text><rect x="87" y="84" width="42" height="40" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="304" y="83" width="40" height="50" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="85" y="224" width="35" height="43" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="453" y="85" width="43" height="35" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="660" y="85" width="43" height="35" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="453" y="237" width="43" height="35" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="660" y="237" width="43" height="35" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><text x="72" y="323" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Exclusion reduces local fill options</text><text x="432" y="323" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Evaluate both density and environment</text></svg>
