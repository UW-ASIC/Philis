<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 365" role="img" aria-labelledby="pb-flow-title"><title id="pb-flow-title">From circuit specification to a coupled wire budget</title><desc>A phase-margin requirement and worst pre-layout value leave six degrees. Two routed branches consume that same allowance according to different sensitivities.</desc><rect width="800" height="365" fill="#f8fafc"/><rect x="28" y="35" width="215" height="85" fill="#e0e7ff" stroke="#4f46e5"/><text x="45" y="69" font-size="18">Required PM ≥ 60°</text><text x="45" y="100" font-size="16">Worst baseline PM = 66°</text><path d="M243 79 L305 79" stroke="#334155" stroke-width="2"/><rect x="307" y="35" width="192" height="85" fill="#fde68a" stroke="#ca8a04"/><text x="330" y="72" font-size="19">6° shared allowance</text><text x="337" y="102" font-size="15">before model reserve</text><rect x="62" y="208" width="115" height="70" fill="#bfdbfe" stroke="#2563eb"/><rect x="620" y="208" width="115" height="70" fill="#a7f3d0" stroke="#059669"/><text x="82" y="249" font-size="18">Node A</text><text x="640" y="249" font-size="18">Node B</text><path d="M177 224 H365 V168 H540 V224 H620" stroke="#2563eb" stroke-width="7" fill="none"/><path d="M177 263 H395 V305 H559 V263 H620" stroke="#059669" stroke-width="7" fill="none"/><text x="245" y="150" font-size="16">CA consumes 0.02°/fF</text><text x="268" y="338" font-size="16">CB consumes 0.05°/fF</text><rect x="535" y="38" width="235" height="80" fill="#fff" stroke="#64748b"/><text x="550" y="69" font-size="17">0.02 CA + 0.05 CB ≤ 6</text><text x="550" y="100" font-size="15">One electrical requirement</text></svg>
