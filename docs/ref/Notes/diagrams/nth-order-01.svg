<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" id="moment-svg" viewBox="0 0 444 280" role="img" aria-label="Illustrative unit pattern"><title>ABBA first-order common-centroid pattern</title><desc>Four identical units arranged A, B, B, A. Their centroids coincide, but their second x moments differ.</desc><rect x="93" y="120" width="54" height="40" fill="#00655f"/><rect x="161" y="120" width="54" height="40" fill="#98541b"/><rect x="229" y="120" width="54" height="40" fill="#98541b"/><rect x="297" y="120" width="54" height="40" fill="#00655f"/><g fill="white" font-size="22" text-anchor="middle"><text x="120" y="147">A</text><text x="188" y="147">B</text><text x="256" y="147">B</text><text x="324" y="147">A</text></g></svg>
