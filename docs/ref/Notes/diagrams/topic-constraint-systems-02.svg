<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="cs-conflict-title"><title id="cs-conflict-title">A small inconsistent constraint set</title><desc>Fixed coordinates imply a symmetry axis at ninety, conflicting with a required axis at one hundred. The diagram identifies the contributing requirements.</desc><rect width="800" height="340" fill="#f8fafc"/><rect x="28" y="35" width="214" height="68" fill="#bfdbfe" stroke="#2563eb"/><text x="49" y="75" font-size="18">Fixed A: xA = 10</text><rect x="28" y="142" width="214" height="68" fill="#a7f3d0" stroke="#059669"/><text x="49" y="183" font-size="18">Fixed B: xB = 170</text><rect x="300" y="90" width="228" height="100" fill="#e0e7ff" stroke="#4f46e5"/><text x="322" y="125" font-size="18">xA + xB = 2a</text><text x="322" y="160" font-size="18">therefore a = 90</text><path d="M242 69 L300 123 M242 176 L300 158" stroke="#334155" stroke-width="2"/><rect x="574" y="90" width="199" height="100" fill="#fecaca" stroke="#dc2626"/><text x="592" y="125" font-size="18">Required a = 100</text><text x="592" y="160" font-size="18" fill="#b91c1c">Contradiction</text><path d="M528 140 H574" stroke="#dc2626" stroke-width="3"/><rect x="151" y="255" width="494" height="54" fill="#fff" stroke="#64748b"/><text x="170" y="289" font-size="17">Report the core; change only an authorized free choice.</text></svg>
