<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="root-route-matching-title" aria-describedby="root-route-matching-desc" font-family="system-ui, sans-serif"><title id="root-route-matching-title">Length equality is only one route-matching feature</title><desc id="root-route-matching-desc">Two equal-length routes use the same layers and via count but have different per-layer lengths, leading to potentially different resistance and capacitance.</desc><text x="24" y="32" font-size="20" text-anchor="start" fill="#20343b">Length equality is only one route-matching feature</text><text x="28" y="72" font-size="18" text-anchor="start" fill="#20343b">Same total length, different stack usage</text><rect x="28" y="111" width="80" height="48" fill="#edf0ed" stroke="#20343b" stroke-width="1.5"/><text x="68.0" y="141.0" font-size="16" text-anchor="middle" fill="#20343b">pin</text><rect x="694" y="111" width="80" height="48" fill="#edf0ed" stroke="#20343b" stroke-width="1.5"/><text x="734.0" y="141.0" font-size="16" text-anchor="middle" fill="#20343b">pin</text><rect x="28" y="226" width="80" height="48" fill="#edf0ed" stroke="#20343b" stroke-width="1.5"/><text x="68.0" y="256.0" font-size="16" text-anchor="middle" fill="#20343b">pin</text><rect x="694" y="226" width="80" height="48" fill="#edf0ed" stroke="#20343b" stroke-width="1.5"/><text x="734.0" y="256.0" font-size="16" text-anchor="middle" fill="#20343b">pin</text><rect x="108" y="128" width="586" height="14" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><rect x="350" y="128" width="100" height="14" fill="#ffe6ad" stroke="#20343b" stroke-width="1.5"/><rect x="341" y="122" width="18" height="26" fill="#20343b" stroke="#20343b" stroke-width="1.5"/><rect x="441" y="122" width="18" height="26" fill="#20343b" stroke="#20343b" stroke-width="1.5"/><text x="140" y="180" font-size="17" text-anchor="start" fill="#20343b">Route A: 100 drawn units on layer 2; two transitions</text><rect x="108" y="243" width="140" height="14" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><rect x="248" y="243" width="280" height="14" fill="#ffe6ad" stroke="#20343b" stroke-width="1.5"/><rect x="528" y="243" width="166" height="14" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><rect x="239" y="237" width="18" height="26" fill="#20343b" stroke="#20343b" stroke-width="1.5"/><rect x="519" y="237" width="18" height="26" fill="#20343b" stroke="#20343b" stroke-width="1.5"/><text x="140" y="300" font-size="17" text-anchor="start" fill="#20343b">Route B: 280 drawn units on layer 2; two transitions</text><rect x="31" y="341" width="23" height="15" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="63" y="355" font-size="15" text-anchor="start" fill="#20343b">layer 1</text><rect x="175" y="341" width="23" height="15" fill="#ffe6ad" stroke="#20343b" stroke-width="1.5"/><text x="207" y="355" font-size="15" text-anchor="start" fill="#20343b">layer 2</text><rect x="315" y="341" width="16" height="15" fill="#20343b" stroke="#20343b" stroke-width="1.5"/><text x="340" y="355" font-size="15" text-anchor="start" fill="#20343b">via</text></svg>
