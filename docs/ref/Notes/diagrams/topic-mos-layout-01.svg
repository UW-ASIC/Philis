<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-mos-layout-fig-1"><title id="topic-mos-layout-fig-1">Cell reflection can preserve centroid while reversing terminal direction</title><desc>Two matching transistor groups have the same number of rectangular units. Group A contains three right-directed and one left-directed unit; group B contains one right-directed and three left-directed units, producing opposite average orientation despite equal outlines.</desc><text x="45" y="35" font-family="system-ui, sans-serif" font-size="20" fill="#172033" text-anchor="start">Track signed terminal direction, not just the shape transform</text><text x="65" y="85" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Group A: 3 right, 1 left</text><text x="443" y="85" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Group B: 1 right, 3 left</text><rect x="65" y="110" width="280" height="65" rx="0" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="435" y="110" width="280" height="65" rx="0" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="82" y="150" font-family="system-ui, sans-serif" font-size="25" fill="#172033" text-anchor="start">→    →    →    ←</text><text x="452" y="150" font-family="system-ui, sans-serif" font-size="25" fill="#172033" text-anchor="start">→    ←    ←    ←</text><text x="103" y="221" font-family="system-ui, sans-serif" font-size="21" fill="#172033" text-anchor="start">ΦA = (3 − 1)/4 = +½</text><text x="474" y="221" font-family="system-ui, sans-serif" font-size="21" fill="#172033" text-anchor="start">ΦB = (1 − 3)/4 = −½</text><text x="65" y="275" font-family="system-ui, sans-serif" font-size="18" fill="#172033" text-anchor="start">Equal outlines and coincident geometric centers can still mismatch.</text><text x="65" y="310" font-family="system-ui, sans-serif" font-size="18" fill="#172033" text-anchor="start">For 2D arrays retain both horizontal and vertical components.</text></svg>
