<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 335" role="img" aria-labelledby="sa-move-title"><title id="sa-move-title">A compound pair move preserves symmetry</title><desc>Initial mirrored rectangles, an invalid one-sided move, and a valid pair expansion are compared about a dashed symmetry axis.</desc><rect width="800" height="335" fill="#f8fafc"/><text x="35" y="38" font-size="18">Initial state</text><text x="280" y="38" font-size="18">Move only A</text><text x="547" y="38" font-size="18">Move the pair</text><line x1="140" y1="67" x2="140" y2="248" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 5"/><line x1="398" y1="67" x2="398" y2="248" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 5"/><line x1="658" y1="67" x2="658" y2="248" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 5"/><rect x="55" y="112" width="60" height="90" fill="#bfdbfe" stroke="#2563eb"/><rect x="165" y="112" width="60" height="90" fill="#bfdbfe" stroke="#2563eb"/><rect x="279" y="112" width="60" height="90" fill="#fecaca" stroke="#dc2626"/><rect x="423" y="112" width="60" height="90" fill="#bfdbfe" stroke="#2563eb"/><rect x="539" y="112" width="60" height="90" fill="#a7f3d0" stroke="#059669"/><rect x="717" y="112" width="60" height="90" fill="#a7f3d0" stroke="#059669"/><text x="77" y="163" font-size="19">A</text><text x="186" y="163" font-size="19">B</text><text x="299" y="163" font-size="19">A</text><text x="444" y="163" font-size="19">B</text><text x="559" y="163" font-size="19">A</text><text x="738" y="163" font-size="19">B</text><text x="32" y="277" font-size="16">xA + xB = 2a</text><text x="280" y="277" font-size="16" fill="#b91c1c">Equality broken</text><text x="541" y="277" font-size="16" fill="#047857">Equality preserved</text><text x="35" y="317" font-size="15" fill="#334155">External clearance, pin access and other groups still require validation.</text></svg>
