<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="substrate-section-title"><title id="substrate-section-title">Conceptual substrate, guard contact, and isolated well cross section</title><desc>A noisy diffusion at the left and a protected device in a p well inside a deep n well at the right share a p type substrate. A p plus guard contact has its own metal return. Deep well and local body contacts need defined biases and impedance paths.</desc><rect x="10" y="10" width="780" height="370" rx="12" fill="#f7fafc" stroke="#cbd5df"/><text x="30" y="42" font-size="20" fill="#17314a">Cross section: contacts and return impedances are part of isolation</text><rect x="35" y="125" width="730" height="170" fill="#efd4ba" stroke="#996b3b" stroke-width="2"/><text x="63" y="270" font-size="19" fill="#593a1e">p substrate: conductive spreading path</text><rect x="415" y="130" width="320" height="116" fill="#bad4f0" stroke="#386a9c" stroke-width="2"/><rect x="445" y="143" width="215" height="75" fill="#eed9c6" stroke="#996b3b" stroke-width="2"/><text x="482" y="202" font-size="16" fill="#593a1e">local p well</text><text x="482" y="237" font-size="16" fill="#244c76">deep n well</text><rect x="90" y="120" width="85" height="24" fill="#5e91c2" stroke="#244c76"/><rect x="330" y="120" width="40" height="24" fill="#b86358" stroke="#813e35"/><rect x="465" y="139" width="30" height="24" fill="#b86358" stroke="#813e35"/><rect x="545" y="139" width="65" height="24" fill="#5e91c2" stroke="#244c76"/><rect x="685" y="125" width="30" height="26" fill="#5e91c2" stroke="#244c76"/><g fill="#566e83"><rect x="121" y="80" width="18" height="40"/><rect x="341" y="85" width="18" height="35"/><rect x="471" y="88" width="18" height="51"/><rect x="691" y="85" width="18" height="40"/></g><rect x="290" y="75" width="90" height="12" fill="#73a19d"/><rect x="452" y="76" width="82" height="12" fill="#73a19d"/><rect x="665" y="73" width="80" height="12" fill="#85a8cc"/><g font-size="15" fill="#17314a"><text x="60" y="70">aggressor edge</text><text x="277" y="65">guard return</text><text x="432" y="65">local body return</text><text x="647" y="62">well bias</text><text x="51" y="174">noisy n+ diffusion</text><text x="279" y="174">p+ guard tap</text><text x="536" y="181">victim</text></g><rect x="35" y="297" width="730" height="18" fill="#9f9e9d"/><text x="42" y="342" font-size="16" fill="#17314a">Backside / package return: finite resistance and inductance, not ideal ground.</text><text x="42" y="367" font-size="15" fill="#17314a">Blue: n type regions. Tan: p type regions. Red: p+ contacts. Gray: conductors.</text></svg>
