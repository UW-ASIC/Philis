<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 355" role="img" aria-labelledby="pr-sp-title"><title id="pr-sp-title">Three blocks decoded from a sequence pair</title><desc>Two permutations give A above B and both left of C. A constraint graph and corresponding six by five packing are shown.</desc><rect width="800" height="355" fill="#f8fafc"/><text x="25" y="32" font-size="19" fill="#0f172a">α = A B C     β = B A C</text><text x="25" y="66" font-size="16" fill="#334155">Horizontal precedence</text><rect x="32" y="87" width="65" height="40" rx="4" fill="#bfdbfe" stroke="#2563eb"/><text x="56" y="113" font-size="17">A</text><rect x="32" y="161" width="65" height="40" rx="4" fill="#a7f3d0" stroke="#059669"/><text x="56" y="187" font-size="17">B</text><rect x="235" y="123" width="65" height="40" rx="4" fill="#fde68a" stroke="#ca8a04"/><text x="259" y="149" font-size="17">C</text><path d="M97 107 L225 137 M97 181 L225 150" stroke="#334155" stroke-width="2" fill="none"/><text x="130" y="104" font-size="15">+4</text><text x="130" y="188" font-size="15">+3</text><text x="25" y="243" font-size="16" fill="#334155">Vertical: yA ≥ yB + 3</text><text x="25" y="281" font-size="15" fill="#334155">Longest paths produce coordinates.</text><rect x="400" y="50" width="288" height="240" fill="none" stroke="#64748b" stroke-dasharray="6 4"/><rect x="400" y="50" width="192" height="96" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="458" y="103" font-size="19">A: 4 × 2</text><rect x="400" y="146" width="144" height="144" fill="#a7f3d0" stroke="#059669" stroke-width="2"/><text x="438" y="224" font-size="19">B: 3 × 3</text><rect x="592" y="98" width="96" height="192" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/><text x="608" y="180" font-size="18">C: 2 × 4</text><text x="400" y="321" font-size="16" fill="#334155">Packed width 6; height 5; zero gap example</text></svg>
