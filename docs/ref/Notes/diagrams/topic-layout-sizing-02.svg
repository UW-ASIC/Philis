<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 375" role="img" aria-labelledby="ls-loop-title"><title id="ls-loop-title">Nested sizing and layout loop</title><desc>The outer loop proposes sizes. The inner loop generates variants, places and routes them, and extracts geometry. Electrical and robustness evaluation returns measured margins to the sizing optimizer and local feedback to layout.</desc><rect width="800" height="375" fill="#f8fafc"/><rect x="27" y="44" width="162" height="76" fill="#e0e7ff" stroke="#4f46e5"/><text x="47" y="76" font-size="18">Sizing proposal</text><text x="47" y="103" font-size="15">W, L, bias, ratios</text><rect x="243" y="44" width="164" height="76" fill="#bfdbfe" stroke="#2563eb"/><text x="262" y="76" font-size="18">Legal variants</text><text x="262" y="103" font-size="15">geometry + identity</text><rect x="458" y="44" width="145" height="76" fill="#a7f3d0" stroke="#059669"/><text x="476" y="76" font-size="18">Place + route</text><text x="476" y="103" font-size="15">physical choices</text><rect x="649" y="44" width="126" height="76" fill="#fde68a" stroke="#ca8a04"/><text x="667" y="76" font-size="18">Extraction</text><text x="667" y="103" font-size="15">R, C, devices</text><path d="M189 81 H243 M407 81 H458 M603 81 H649" stroke="#334155" stroke-width="2" fill="none"/><rect x="300" y="219" width="335" height="83" fill="#fff" stroke="#64748b"/><text x="320" y="250" font-size="18">Circuit + robust performance checks</text><text x="320" y="279" font-size="16">margins, failure modes, model error</text><path d="M712 120 V260 H635 M300 260 H108 V120" stroke="#7c3aed" stroke-width="3" fill="none"/><path d="M530 219 V120" stroke="#059669" stroke-width="2" stroke-dasharray="5 4"/><text x="556" y="179" font-size="15" fill="#047857">local repair feedback</text><text x="40" y="347" font-size="16" fill="#334155">Cache and warm-start only when model, topology and scenario identities remain valid.</text></svg>
