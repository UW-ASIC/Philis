<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-fabrication-fig-1"><title id="topic-fabrication-fig-1">A physical stack is more than its top-view footprint</title><desc>An amber well in a green silicon substrate contains two active diffusions under a purple gate. Contacts join the diffusions to blue metal above oxide. Each layer has a different physical role.</desc><rect x="70" y="200" width="660" height="100" rx="0" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="85" y="282" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Substrate: distributed electrical and thermal medium</text><rect x="220" y="210" width="380" height="60" rx="0" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="360" y="258" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Well / body region</text><rect x="70" y="100" width="660" height="95" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="90" y="152" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Dielectrics</text><rect x="250" y="180" width="90" height="38" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><rect x="440" y="180" width="90" height="38" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><rect x="335" y="166" width="115" height="18" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><text x="355" y="154" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Gate</text><rect x="274" y="125" width="28" height="55" rx="0" fill="#64748b" stroke="#334155" stroke-width="2"/><rect x="475" y="125" width="28" height="55" rx="0" fill="#64748b" stroke="#334155" stroke-width="2"/><rect x="140" y="105" width="185" height="20" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="455" y="105" width="210" height="20" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><text x="90" y="70" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Blue = metal   Gray = contact   Purple = gate   Green = active / silicon</text><text x="260" y="238" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Source</text><text x="465" y="238" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Drain</text></svg>
