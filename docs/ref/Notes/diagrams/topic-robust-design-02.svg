<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 375" role="img" aria-labelledby="rd-regions-title"><title id="rd-regions-title">A tolerance ball, box and half-space have different probabilities</title><desc>In two standardized dimensions a radius-three circle lies inside a plus-or-minus-three box. The one-sided bound on the first coordinate is a different region extending beyond both.</desc><rect width="800" height="375" fill="#f8fafc"/><rect x="45" y="45" width="290" height="290" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4"/><circle cx="190" cy="190" r="145" fill="#ddd6fe" fill-opacity="0.75" stroke="#7c3aed" stroke-width="2"/><line x1="25" y1="190" x2="365" y2="190" stroke="#334155"/><line x1="190" y1="22" x2="190" y2="353" stroke="#334155"/><line x1="335" y1="20" x2="335" y2="352" stroke="#dc2626" stroke-width="3"/><text x="327" y="369" font-size="16">z1 = 3</text><text x="175" y="184" font-size="16">0</text><text x="40" y="28" font-size="15">z2</text><rect x="403" y="46" width="369" height="284" fill="#fff" stroke="#64748b"/><text x="425" y="83" font-size="18" fill="#7c3aed">Ball: z1² + z2² ≤ 9</text><text x="425" y="116" font-size="16">Probability ≈ 98.889%</text><text x="425" y="164" font-size="18" fill="#0284c7">Box: |z1| ≤ 3 and |z2| ≤ 3</text><text x="425" y="197" font-size="16">Probability ≈ 99.461%</text><text x="425" y="247" font-size="18" fill="#dc2626">Half-space: z1 ≤ 3</text><text x="425" y="280" font-size="16">Probability ≈ 99.865%</text><text x="420" y="355" font-size="15">Here z1 and z2 are independent N(0, 1).</text></svg>
