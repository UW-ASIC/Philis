<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="root-validation-ladder-title" aria-describedby="root-validation-ladder-desc" font-family="system-ui, sans-serif"><title id="root-validation-ladder-title">Test a mechanism, then the realized circuit and full flow</title><desc id="root-validation-ladder-desc">Four ascending rectangles show algebra and mapping checks, isolated structures, complete circuit blocks and independently verified final layouts.</desc><text x="24" y="32" font-size="20" text-anchor="start" fill="#20343b">Test a mechanism, then the realized circuit and full flow</text><rect x="28" y="260" width="176" height="87" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="116.0" y="298.5" font-size="16" text-anchor="middle" fill="#20343b">1. Algebra</text><text x="116.0" y="320.5" font-size="16" text-anchor="middle" fill="#20343b">units / identities</text><line x1="204" y1="299" x2="225" y2="220" stroke="#20343b" stroke-width="2"/><polygon points="225.0,220.0 226.9,229.8 218.5,227.6" fill="#20343b"/><rect x="226" y="179" width="176" height="87" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="314.0" y="217.5" font-size="16" text-anchor="middle" fill="#20343b">2. Structures</text><text x="314.0" y="239.5" font-size="16" text-anchor="middle" fill="#20343b">R / C / fields</text><line x1="402" y1="220" x2="421" y2="146" stroke="#20343b" stroke-width="2"/><polygon points="421.0,146.0 423.0,155.8 414.5,153.6" fill="#20343b"/><rect x="422" y="103" width="176" height="87" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="510.0" y="141.5" font-size="16" text-anchor="middle" fill="#20343b">3. Circuits</text><text x="510.0" y="163.5" font-size="16" text-anchor="middle" fill="#20343b">actual metrics</text><line x1="598" y1="146" x2="613" y2="81" stroke="#20343b" stroke-width="2"/><polygon points="613.0,81.0 615.2,90.8 606.7,88.8" fill="#20343b"/><rect x="614" y="58" width="166" height="76" fill="#ffe6ad" stroke="#20343b" stroke-width="1.5"/><text x="697.0" y="91.0" font-size="16" text-anchor="middle" fill="#20343b">4. Full flow</text><text x="697.0" y="113.0" font-size="16" text-anchor="middle" fill="#20343b">coverage + yield</text><text x="35" y="383" font-size="18" text-anchor="start" fill="#20343b">Hold comparison conditions fixed and include counterexamples.</text></svg>
