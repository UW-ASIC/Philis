[package]
name = "philis"
version = "0.1.0"
edition = "2021"

[dependencies]
pnr-core = { path = "frontend/core" }
pnr-visualizer = { path = "tools/visualizer" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# GPU-accelerated signoff (DRC spacing prefilter). Needs the nix devshell
# (CUDA/Vulkan) at build and a GPU at runtime. Builds against a local GPurify
# that exposes run_drc_no_density_backend — see [patch] below.
gpu = ["pnr-core/gpu"]

[workspace]
resolver = "2"
members = [
    # Frontend
    "frontend/annotator",
    "frontend/substrate3",
    "frontend/core",

    # Backend
    "backend",
    "backend/engine",
    "backend/cells",
    "backend/constraints",
    "backend/placement",
    "backend/routing",

    # Tools
    "tools/visualizer",
    "tools/benchmark",
]

[workspace.dependencies]
gdsverify = { git = "https://github.com/UW-ASIC/GPurify", branch = "main" }
