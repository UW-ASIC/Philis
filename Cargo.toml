[package]
name = "philis"
version = "0.1.0"
edition = "2021"

[dependencies]
pnr-core = { path = "frontend/core" }

[workspace]
resolver = "2"
members = [
    # Frontend
    "frontend/annotator",
    "frontend/substrate3",
    "frontend/core",

    # Backend
    "backend",
    "backend/engine",
    "backend/cells",
    "backend/constraints",
    "backend/placement",
    "backend/routing",

    # Tools
    "tools/visualizer",
    "tools/benchmark",
]

[workspace.dependencies]
gdsverify = { git = "https://github.com/UW-ASIC/GPurify", branch = "main" }
