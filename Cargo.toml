[workspace]
resolver = "2"
members = [
  "kernel/core", "kernel/analog", "kernel/cells", "kernel/macroMaster", "kernel/visualizer",
  "backend/gp", "backend/dp", "backend/gr", "backend/dr", "backend/annotator", "backend/verify",
  "frontend/library", "frontend/cli",
  "benchmarks",
  "examples/three_stage_opamp",
  "examples/op_demo",
]

# GPurify, consumed from git at its default branch. No `rev`: `Cargo.lock`
# still pins the exact commit, so builds stay reproducible — `cargo update -p
# gpurify` is how you move to latest. Both entries share the URL, so the facade
# and the geometry crate always resolve to the same commit.
#
# Two entries rather than one: `gdsverify` is the whole verifier (engine,
# export, the check tiers), which `verify` and `macroMaster` want. The viewer
# only probes a `GeometryStore`, so it takes `gdsverify-geom` alone and keeps
# the engine out of a GPU build.
[workspace.dependencies]
fearless_simd = "1.0.0"
gdsverify = { package = "gpurify", git = "https://github.com/UW-ASIC/GPurify" }
gdsverify-geom = { package = "gpurify-geom", git = "https://github.com/UW-ASIC/GPurify" }
# Substrate2 (UC Berkeley), pinned: `macro_master` re-exports it and adds
# Philis's features on top. Bump the rev on purpose; its 0.x API moves.
substrate = { git = "https://github.com/ucb-substrate/substrate2", rev = "01d9600f946437d3bc18806a6517e35001b68251" }
sky130 = { git = "https://github.com/ucb-substrate/substrate2", rev = "01d9600f946437d3bc18806a6517e35001b68251" }
layir = { git = "https://github.com/ucb-substrate/substrate2", rev = "01d9600f946437d3bc18806a6517e35001b68251" }
gdsconv = { git = "https://github.com/ucb-substrate/substrate2", rev = "01d9600f946437d3bc18806a6517e35001b68251" }
gds = { git = "https://github.com/ucb-substrate/substrate2", rev = "01d9600f946437d3bc18806a6517e35001b68251" }
scir = { git = "https://github.com/ucb-substrate/substrate2", rev = "01d9600f946437d3bc18806a6517e35001b68251" }
spice = { git = "https://github.com/ucb-substrate/substrate2", rev = "01d9600f946437d3bc18806a6517e35001b68251" }
