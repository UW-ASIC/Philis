[package]
name = "visualizer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "visualizer"

[[bin]]
name = "visualizer"
path = "src/main.rs"

[dependencies]
pnr_core = { path = "../core" }
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
earcutr = "0.4"
serde_json = "1"
