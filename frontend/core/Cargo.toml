[package]
name = "pnr-core"
version = "0.1.0"
edition = "2021"

[features]
visualizer = ["pnr-backend/visualizer"]

[dependencies]
gdsverify = { workspace = true }
pnr-annotator = { path = "../annotator" }
pnr-backend = { path = "../../backend" }
pnr-cells = { path = "../../backend/cells" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
