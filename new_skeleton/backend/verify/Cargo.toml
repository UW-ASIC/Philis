[package]
name = "verify"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Route DRC/ERC through the GPU backend (CUDA/Vulkan). Forwarded to gdsverify's
# own `gpu` feature; only builds inside the nix devshell with CUDA/Vulkan present.
gpu = ["gdsverify/gpu"]

[dependencies]
pnr_core = { path = "../../kernel/core" }
analog = { path = "../../kernel/analog" }
# gdsverify (GPurify) — real GPU-accelerated DRC/ERC/LVS/PEX. Git dep mirrors the
# repo-root Cargo.toml.
gdsverify = { git = "https://github.com/UW-ASIC/GPurify", branch = "main" }
# The deck's `cell` section is Philis's own (layer roles + routing stack);
# gdsverify's reader has no field for it and drops it, so we re-read it here.
serde_json = "1"
