[package]
name = "pnr-backend"
version = "0.1.0"
edition = "2021"

[features]
visualizer = []
gpu = ["gdsverify/gpu", "pnr-cells/gpu"]

[dependencies]
gdsverify = { workspace = true }
pnr-cells = { path = "cells" }
pnr-constraints = { path = "constraints" }
pnr-engine = { path = "engine" }
pnr-placement = { path = "placement" }
pnr-routing = { path = "routing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
