<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="em-via-title"><title id="em-via-title">Via count alone does not determine current sharing</title><desc>The left array sits at an orthogonal turn and is shown with an overloaded inner cut. The right array has more symmetric access from its connected wires. Colors are conceptual and require an extracted electrical solution for quantitative assessment.</desc><rect x="10" y="10" width="780" height="370" rx="12" fill="#f7fafc" stroke="#cbd5df"/><text x="28" y="44" font-size="19" fill="#17314a">Unequal paths at an orthogonal turn</text><text x="421" y="44" font-size="19" fill="#17314a">Candidate with symmetric access</text><rect x="83" y="78" width="114" height="212" fill="#cbdceb" stroke="#537692" stroke-width="2"/><rect x="83" y="199" width="263" height="91" fill="#aac9e5" stroke="#32658e" stroke-width="2"/><rect x="103" y="217" width="29" height="29" fill="#4f9fa8" stroke="#244e62"/><rect x="151" y="217" width="29" height="29" fill="#c95c47" stroke="#863b2e"/><rect x="103" y="258" width="29" height="29" fill="#75bac2" stroke="#244e62"/><rect x="151" y="258" width="29" height="29" fill="#d18d56" stroke="#86542e"/><text x="111" y="122" font-size="20" fill="#17314a">I ↓</text><text x="267" y="253" font-size="20" fill="#17314a">I →</text><text x="210" y="188" font-size="16" fill="#863b2e">inner cut can dominate</text><rect x="433" y="140" width="206" height="94" fill="#cbdceb" stroke="#537692" stroke-width="2"/><rect x="533" y="140" width="215" height="94" fill="#aac9e5" stroke="#32658e" stroke-width="2"/><g fill="#4f9fa8" stroke="#244e62"><rect x="544" y="165" width="27" height="24"/><rect x="605" y="165" width="27" height="24"/><rect x="544" y="197" width="27" height="24"/><rect x="605" y="197" width="27" height="24"/></g><text x="438" y="127" font-size="20" fill="#17314a">I →</text><text x="708" y="127" font-size="20" fill="#17314a">I →</text><text x="430" y="278" font-size="16" fill="#17314a">Evaluate connected metal and each cut.</text><text x="35" y="326" font-size="17" fill="#17314a">Blue rectangles: connected metal layers. Small rectangles: via cuts.</text><text x="35" y="357" font-size="16" fill="#17314a">Warm colors illustrate possible crowding; these are not simulated current values.</text></svg>
