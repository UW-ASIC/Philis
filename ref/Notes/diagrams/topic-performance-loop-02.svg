<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="root-pareto-candidates-title" aria-describedby="root-pareto-candidates-desc" font-family="system-ui, sans-serif"><title id="root-pareto-candidates-title">Different feasible candidates can remain incomparable</title><desc id="root-pareto-candidates-desc">Three feasible points trade area against delay. A fourth point is dominated. All candidates must first satisfy required constraints.</desc><text x="24" y="32" font-size="20" text-anchor="start" fill="#20343b">Different feasible candidates can remain incomparable</text><line x1="83" y1="348" x2="747" y2="348" stroke="#20343b" stroke-width="2"/><polygon points="747.0,348.0 738.0,352.3 738.0,343.7" fill="#20343b"/><line x1="83" y1="348" x2="83" y2="75" stroke="#20343b" stroke-width="2"/><polygon points="83.0,75.0 87.3,84.0 78.7,84.0" fill="#20343b"/><text x="658" y="389" font-size="18" text-anchor="start" fill="#20343b">Area →</text><text x="22" y="65" font-size="18" text-anchor="start" fill="#20343b">Delay</text><rect x="213" y="98" width="14" height="14" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="233" y="111" font-size="16" text-anchor="start" fill="#20343b">A: small, slower</text><rect x="409" y="210" width="14" height="14" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="429" y="223" font-size="16" text-anchor="start" fill="#20343b">B: middle</text><rect x="618" y="295" width="14" height="14" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="638" y="308" font-size="16" text-anchor="start" fill="#20343b">C: larger, faster</text><rect x="608" y="110" width="14" height="14" fill="#f5d5ce" stroke="#20343b" stroke-width="1.5"/><text x="628" y="123" font-size="16" text-anchor="start" fill="#20343b">D: dominated</text><text x="107" y="399" font-size="16" text-anchor="start" fill="#20343b">Minimize both; all points assumed feasible under the same contract.</text></svg>
