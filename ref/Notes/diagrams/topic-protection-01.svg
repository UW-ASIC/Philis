<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-protection-fig-1"><title id="topic-protection-fig-1">A higher-layer bridge changes early antenna connectivity</title><desc>The upper drawing has a gate connected to a long metal-one conductor. The lower drawing breaks metal one near the gate and reconnects it through a later metal-two bridge, so the early gate-connected island is smaller.</desc><text x="45" y="32" font-family="system-ui, sans-serif" font-size="20" fill="#172033" text-anchor="start">Fabrication stage is part of the connectivity model</text><text x="45" y="75" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Before repair: one early connected component</text><rect x="90" y="101" width="35" height="60" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><rect x="110" y="115" width="570" height="18" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><text x="78" y="185" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Gate oxide</text><text x="348" y="156" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Long exposed M1 conductor</text><text x="45" y="211" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">After repair: short gate island during M1 processing</text><rect x="90" y="253" width="35" height="60" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><rect x="110" y="267" width="80" height="18" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="270" y="267" width="410" height="18" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="176" y="229" width="108" height="16" rx="0" fill="#fca5a5" stroke="#334155" stroke-width="2"/><rect x="176" y="245" width="14" height="22" rx="0" fill="#64748b" stroke="#334155" stroke-width="2"/><rect x="270" y="245" width="14" height="22" rx="0" fill="#64748b" stroke="#334155" stroke-width="2"/><text x="360" y="242" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Red = later M2 bridge</text><text x="45" y="340" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">The final net is connected in both cases; the early exposed node differs.</text></svg>
