<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-protection-fig-2"><title id="topic-protection-fig-2">Protection is a complete current path with a local voltage reference</title><desc>A pad connects to primary protection and then to a sensitive gate through an optional qualified limiting element. A secondary protector sits beside the gate, and both local return connections meet near the protected source.</desc><text x="45" y="32" font-family="system-ui, sans-serif" font-size="20" fill="#172033" text-anchor="start">Check clamp behavior, signal path and return path together</text><rect x="45" y="79" width="85" height="55" rx="0" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="87" y="112" font-family="system-ui, sans-serif" font-size="18" fill="#172033" text-anchor="middle">PAD</text><rect x="170" y="190" width="135" height="64" rx="0" fill="#fecaca" stroke="#334155" stroke-width="2"/><text x="237" y="216" font-family="system-ui, sans-serif" font-size="17" fill="#172033" text-anchor="middle">Primary</text><text x="237" y="239" font-family="system-ui, sans-serif" font-size="17" fill="#172033" text-anchor="middle">protection</text><line x1="130" y1="106" x2="717" y2="106" stroke="#2563eb" stroke-width="6"/><line x1="237" y1="106" x2="237" y2="190" stroke="#dc2626" stroke-width="6"/><rect x="395" y="85" width="122" height="44" rx="0" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="456" y="112" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="middle">Qualified R</text><rect x="575" y="190" width="132" height="64" rx="0" fill="#fbcfe8" stroke="#334155" stroke-width="2"/><text x="641" y="216" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="middle">Secondary</text><text x="641" y="239" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="middle">protection</text><rect x="717" y="85" width="32" height="90" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><text x="696" y="70" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Gate</text><line x1="642" y1="106" x2="642" y2="190" stroke="#dc2626" stroke-width="4"/><line x1="75" y1="296" x2="750" y2="296" stroke="#475569" stroke-width="8"/><line x1="237" y1="254" x2="237" y2="296" stroke="#dc2626" stroke-width="6"/><line x1="642" y1="254" x2="642" y2="296" stroke="#dc2626" stroke-width="4"/><line x1="733" y1="175" x2="733" y2="296" stroke="#475569" stroke-width="4"/><text x="80" y="332" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Return conductor has finite R and L</text><text x="474" y="280" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Local reference joins</text><text x="77" y="162" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Primary near entry</text><text x="496" y="160" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Local gate protection</text></svg>
