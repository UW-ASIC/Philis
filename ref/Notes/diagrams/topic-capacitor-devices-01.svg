<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-capacitor-devices-fig-1"><title id="topic-capacitor-devices-fig-1">A capacitor has asymmetric external plate coupling</title><desc>Two blue plates are separated by a thin orange dielectric. The bottom plate is closer to a green substrate. A shield lies above. Labeled field paths distinguish intended plate capacitance from plate-to-substrate and plate-to-shield capacitance.</desc><text x="60" y="30" font-family="system-ui, sans-serif" font-size="20" fill="#172033" text-anchor="start">Two schematic terminals do not imply symmetric surroundings</text><rect x="115" y="95" width="555" height="18" rx="0" fill="#94a3b8" stroke="#334155" stroke-width="2"/><text x="125" y="79" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Optional shield: intentional low-impedance connection</text><rect x="240" y="148" width="300" height="18" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><text x="560" y="164" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Top plate</text><rect x="240" y="168" width="300" height="13" rx="0" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="560" y="182" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Dielectric</text><rect x="210" y="185" width="360" height="20" rx="0" fill="#60a5fa" stroke="#334155" stroke-width="2"/><text x="586" y="205" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Bottom plate</text><rect x="85" y="260" width="635" height="50" rx="0" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="303" y="291" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Substrate / well</text><line x1="290" y1="205" x2="290" y2="260" stroke="#b45309" stroke-width="3" stroke-dasharray="5 5"/><line x1="485" y1="205" x2="485" y2="260" stroke="#b45309" stroke-width="3" stroke-dasharray="5 5"/><text x="90" y="241" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Parasitic field paths</text><line x1="350" y1="114" x2="350" y2="147" stroke="#b45309" stroke-width="3" stroke-dasharray="5 5"/></svg>
