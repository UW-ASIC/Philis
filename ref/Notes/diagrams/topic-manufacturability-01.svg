<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-manufacturability-fig-1"><title id="topic-manufacturability-fig-1">Spacing and enclosure constrain different edges</title><desc>Two blue metal shapes are separated by a spacing dimension. In a second example a gray contact is contained inside a larger blue metal rectangle, with enclosure labeled on its sides.</desc><text x="70" y="35" font-family="system-ui, sans-serif" font-size="20" fill="#172033" text-anchor="start">Spacing: keep incompatible edges apart</text><rect x="80" y="70" width="225" height="110" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="390" y="70" width="235" height="110" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><line x1="305" y1="125" x2="390" y2="125" stroke="#b45309" stroke-width="3"/><text x="315" y="105" font-family="system-ui, sans-serif" font-size="19" fill="#172033" text-anchor="start">s</text><text x="80" y="214" font-family="system-ui, sans-serif" font-size="18" fill="#172033" text-anchor="start">Enclosure: surrounding material must extend beyond the opening</text><rect x="115" y="244" width="170" height="83" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="155" y="263" width="89" height="45" rx="0" fill="#64748b" stroke="#334155" stroke-width="2"/><line x1="116" y1="285" x2="154" y2="285" stroke="#b45309" stroke-width="3"/><text x="304" y="273" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Gray = contact or via cut</text><text x="304" y="304" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Blue = required surrounding conductor</text></svg>
