<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-capacitor-devices-fig-2"><title id="topic-capacitor-devices-fig-2">Balanced units can still have unbalanced routing</title><desc>A two-by-two AB BA array has equal device centroids and an outer dummy boundary. The blue A route is direct; the red B route has a long detour near an aggressor. The intended comparison is complete extracted capacitance, not only unit placement.</desc><text x="45" y="32" font-family="system-ui, sans-serif" font-size="19" fill="#172033" text-anchor="start">Unit geometry and route geometry both enter the capacitance network</text><rect x="90" y="68" width="290" height="235" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><rect x="125" y="105" width="90" height="70" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="2"/><rect x="250" y="105" width="90" height="70" rx="0" fill="#fee2e2" stroke="#334155" stroke-width="2"/><rect x="125" y="205" width="90" height="70" rx="0" fill="#fee2e2" stroke="#334155" stroke-width="2"/><rect x="250" y="205" width="90" height="70" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="161" y="147" font-family="system-ui, sans-serif" font-size="24" fill="#172033" text-anchor="start">A</text><text x="284" y="147" font-family="system-ui, sans-serif" font-size="24" fill="#172033" text-anchor="start">B</text><text x="159" y="246" font-family="system-ui, sans-serif" font-size="24" fill="#172033" text-anchor="start">B</text><text x="285" y="246" font-family="system-ui, sans-serif" font-size="24" fill="#172033" text-anchor="start">A</text><text x="102" y="92" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Dummy perimeter</text><line x1="170" y1="175" x2="170" y2="190" stroke="#2563eb" stroke-width="6"/><line x1="170" y1="190" x2="365" y2="190" stroke="#2563eb" stroke-width="6"/><line x1="365" y1="190" x2="365" y2="240" stroke="#2563eb" stroke-width="6"/><line x1="340" y1="240" x2="365" y2="240" stroke="#2563eb" stroke-width="6"/><line x1="340" y1="140" x2="637" y2="140" stroke="#dc2626" stroke-width="5"/><line x1="637" y1="140" x2="637" y2="345" stroke="#dc2626" stroke-width="5"/><line x1="215" y1="240" x2="232" y2="240" stroke="#dc2626" stroke-width="5"/><line x1="232" y1="240" x2="232" y2="345" stroke="#dc2626" stroke-width="5"/><line x1="232" y1="345" x2="637" y2="345" stroke="#dc2626" stroke-width="5"/><rect x="667" y="103" width="24" height="218" rx="0" fill="#fbbf24" stroke="#334155" stroke-width="2"/><text x="506" y="82" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Amber = aggressor</text><text x="391" y="214" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">A</text><text x="609" y="272" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">B</text></svg>
