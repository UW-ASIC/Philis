<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="rd-shared-title"><title id="rd-shared-title">Shared process variation and local mismatch</title><desc>A common global variation enters two device rectangles while each receives its own local variation. Subtracting matched responses can cancel the shared component while local mismatch remains.</desc><rect width="800" height="360" fill="#f8fafc"/><rect x="280" y="25" width="240" height="62" fill="#e0e7ff" stroke="#4f46e5"/><text x="305" y="62" font-size="18">Shared process term g</text><path d="M335 87 V119 H205 V148 M465 87 V119 H595 V148" stroke="#4f46e5" stroke-width="3" fill="none"/><rect x="105" y="150" width="205" height="90" fill="#bfdbfe" stroke="#2563eb"/><rect x="490" y="150" width="205" height="90" fill="#a7f3d0" stroke="#059669"/><text x="133" y="187" font-size="19">Device 1: μ1 + g + l1</text><text x="518" y="187" font-size="19">Device 2: μ2 + g + l2</text><text x="144" y="219" font-size="16">local realization l1</text><text x="529" y="219" font-size="16">local realization l2</text><path d="M205 240 V268 H595 V240" stroke="#334155" stroke-width="2" fill="none"/><rect x="199" y="281" width="402" height="54" fill="#fff" stroke="#64748b"/><text x="225" y="315" font-size="19">Difference = (μ1 − μ2) + (l1 − l2)</text></svg>
