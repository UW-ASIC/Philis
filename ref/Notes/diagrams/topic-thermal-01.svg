<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="thermal-pair-title"><title id="thermal-pair-title">Nearness and equal thermal exposure are different objectives</title><desc>In the left panel two nearby devices sit at different distances from a heater. In the right panel two devices sit on opposite sides at equal distance from a heater. The second pair is farther apart but has equal temperature in the ideal symmetric model.</desc><rect x="10" y="10" width="780" height="370" rx="12" fill="#f7fafc" stroke="#cbd5df"/><text x="25" y="44" font-size="19" fill="#17314a">Close pair, unequal heater distance</text><text x="420" y="44" font-size="19" fill="#17314a">Equal distance, equal ideal rise</text><rect x="48" y="142" width="75" height="90" fill="#de8c73" stroke="#a64b34" stroke-width="2"/><rect x="191" y="151" width="56" height="70" fill="#f3c299" stroke="#956334" stroke-width="2"/><rect x="281" y="151" width="56" height="70" fill="#c7ddef" stroke="#32658e" stroke-width="2"/><g font-size="19" fill="#17314a"><text x="59" y="194">heater</text><text x="211" y="191">A</text><text x="300" y="191">B</text></g><text x="161" y="263" font-size="16" fill="#17314a">T(A) greater than T(B)</text><rect x="563" y="143" width="76" height="82" fill="#de8c73" stroke="#a64b34" stroke-width="2"/><rect x="438" y="151" width="58" height="67" fill="#d7d3e4" stroke="#685b86" stroke-width="2"/><rect x="706" y="151" width="58" height="67" fill="#d7d3e4" stroke="#685b86" stroke-width="2"/><g font-size="19" fill="#17314a"><text x="456" y="191">A</text><text x="574" y="191">heater</text><text x="725" y="191">B</text></g><line x1="497" y1="113" x2="562" y2="113" stroke="#536c82" stroke-width="2"/><line x1="640" y1="113" x2="706" y2="113" stroke="#536c82" stroke-width="2"/><text x="520" y="100" font-size="17" fill="#17314a">r</text><text x="665" y="100" font-size="17" fill="#17314a">r</text><text x="464" y="263" font-size="16" fill="#17314a">T(A) = T(B) in the symmetric model</text><text x="35" y="320" font-size="17" fill="#17314a">Equal temperature must be checked against every significant heat source and mode.</text><text x="35" y="351" font-size="16" fill="#17314a">Longer pair routing, substrate exposure, and absolute temperature still matter.</text></svg>
