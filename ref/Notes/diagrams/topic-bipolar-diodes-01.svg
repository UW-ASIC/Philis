<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="topic-bipolar-diodes-fig-1"><title id="topic-bipolar-diodes-fig-1">Bipolar matching balances emitter units and their access</title><desc>Four equal emitter rectangles use an ABBA assignment within a common array. Purple base-access strips and blue collector-access strips illustrate that equal emitters alone are not the complete device environment.</desc><text x="45" y="32" font-family="system-ui, sans-serif" font-size="19" fill="#172033" text-anchor="start">Match injection geometry and the paths that establish terminal voltage</text><rect x="85" y="65" width="430" height="230" rx="0" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="600" y="97" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Amber = body / tank</text><rect x="102" y="82" width="18" height="194" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="480" y="82" width="18" height="194" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="145" y="86" width="307" height="17" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><rect x="145" y="256" width="307" height="17" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><rect x="180" y="124" width="82" height="47" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><text x="221" y="154" font-family="system-ui, sans-serif" font-size="18" fill="#172033" text-anchor="middle">A</text><rect x="335" y="124" width="82" height="47" rx="0" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><text x="376" y="154" font-family="system-ui, sans-serif" font-size="18" fill="#172033" text-anchor="middle">B</text><rect x="180" y="193" width="82" height="47" rx="0" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><text x="221" y="223" font-family="system-ui, sans-serif" font-size="18" fill="#172033" text-anchor="middle">B</text><rect x="335" y="193" width="82" height="47" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><text x="376" y="223" font-family="system-ui, sans-serif" font-size="18" fill="#172033" text-anchor="middle">A</text><text x="547" y="137" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Green = emitter units</text><text x="547" y="177" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Purple = base access</text><text x="547" y="217" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Blue = collector access</text><text x="85" y="333" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Equal emitter area does not prove equal base or collector voltage.</text></svg>
