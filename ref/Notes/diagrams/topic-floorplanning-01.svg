<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="topic-floorplanning-fig-1"><title id="topic-floorplanning-fig-1">A die floorplan includes package, protection, power and quiet regions</title><desc>A rectangular die has a seal boundary and pad ring. A quiet matched core is at left, a noisy power driver is at right, and wide return and supply corridors connect pads without crossing the sensitive input region.</desc><rect x="30" y="45" width="740" height="330" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><rect x="55" y="69" width="690" height="282" rx="0" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="40" y="26" font-family="system-ui, sans-serif" font-size="18" fill="#172033" text-anchor="start">Die boundary and seal / assembly exclusions</text><rect x="88" y="84" width="74" height="38" rx="0" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><rect x="88" y="296" width="74" height="38" rx="0" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><rect x="620" y="84" width="88" height="38" rx="0" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><rect x="620" y="296" width="88" height="38" rx="0" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="125" y="109" font-family="system-ui, sans-serif" font-size="17" fill="#172033" text-anchor="middle">IN</text><text x="125" y="321" font-family="system-ui, sans-serif" font-size="17" fill="#172033" text-anchor="middle">REF</text><text x="664" y="109" font-family="system-ui, sans-serif" font-size="17" fill="#172033" text-anchor="middle">VDD</text><text x="664" y="321" font-family="system-ui, sans-serif" font-size="14" fill="#172033" text-anchor="middle">RETURN</text><rect x="188" y="132" width="200" height="150" rx="0" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="288" y="164" font-family="system-ui, sans-serif" font-size="17" fill="#172033" text-anchor="middle">Quiet analog core</text><rect x="219" y="189" width="44" height="52" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><rect x="307" y="189" width="44" height="52" rx="0" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><text x="241" y="221" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="middle">A</text><text x="329" y="221" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="middle">B</text><rect x="502" y="155" width="196" height="112" rx="0" fill="#fecaca" stroke="#334155" stroke-width="2"/><text x="600" y="199" font-family="system-ui, sans-serif" font-size="17" fill="#172033" text-anchor="middle">Noisy / hot driver</text><text x="600" y="228" font-family="system-ui, sans-serif" font-size="15" fill="#172033" text-anchor="middle">and local protection</text><line x1="664" y1="122" x2="664" y2="155" stroke="#dc2626" stroke-width="12"/><line x1="664" y1="267" x2="664" y2="296" stroke="#475569" stroke-width="12"/><line x1="162" y1="103" x2="186" y2="103" stroke="#2563eb" stroke-width="3"/><line x1="186" y1="103" x2="186" y2="184" stroke="#2563eb" stroke-width="3"/><line x1="162" y1="314" x2="405" y2="314" stroke="#2563eb" stroke-width="4"/><line x1="405" y1="314" x2="405" y2="260" stroke="#2563eb" stroke-width="4"/><text x="440" y="139" font-family="system-ui, sans-serif" font-size="14" fill="#172033" text-anchor="start">Reserve isolation / access</text><text x="55" y="399" font-family="system-ui, sans-serif" font-size="17" fill="#172033" text-anchor="start">Pin order, thermal gradients and return-current paths constrain placement.</text></svg>
