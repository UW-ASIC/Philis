<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 365" role="img" aria-labelledby="pb-region-title"><title id="pb-region-title">A box allocation excludes electrically feasible candidates</title><desc>A triangular coupled capacitance allowance contains a point outside a smaller box of independent caps. A table verifies the example numerically.</desc><rect width="800" height="365" fill="#f8fafc"/><line x1="65" y1="300" x2="405" y2="300" stroke="#334155" stroke-width="2"/><line x1="65" y1="300" x2="65" y2="40" stroke="#334155" stroke-width="2"/><path d="M65 300 L365 300 L65 60 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="65" y="180" width="150" height="120" fill="#bbf7d0" fill-opacity="0.7" stroke="#059669" stroke-width="2" stroke-dasharray="5 3"/><circle cx="265" cy="260" r="7" fill="#7c3aed"/><text x="275" y="250" font-size="16">(200, 20)</text><text x="64" y="328" font-size="15">0</text><text x="197" y="328" font-size="15">150</text><text x="351" y="328" font-size="15">300</text><text x="15" y="185" font-size="15">60</text><text x="9" y="65" font-size="15">120</text><text x="160" y="355" font-size="16">CA (fF)</text><text x="20" y="25" font-size="16">CB (fF)</text><rect x="450" y="58" width="323" height="242" fill="#fff" stroke="#64748b"/><text x="468" y="91" font-size="18">Coupled check</text><text x="468" y="126" font-size="17">0.02 × 200 + 0.05 × 20 = 5°</text><text x="468" y="158" font-size="17" fill="#047857">5° ≤ 6°: feasible</text><text x="468" y="203" font-size="18">Independent allocation</text><text x="468" y="238" font-size="17" fill="#b91c1c">200 fF &gt; 150 fF cap</text><text x="468" y="274" font-size="16">Reallocate; do not reject blindly.</text></svg>
