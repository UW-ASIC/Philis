<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="root-optimality-flow-title" aria-describedby="root-optimality-flow-desc" font-family="system-ui, sans-serif"><title id="root-optimality-flow-title">Feasibility first; compare quality among verified candidates</title><desc id="root-optimality-flow-desc">Five rectangles show intent, generated geometry, physical checks, electrical evaluation and selection. Missing evidence prevents final certification.</desc><text x="24" y="32" font-size="20" text-anchor="start" fill="#20343b">Feasibility first; compare quality among verified candidates</text><rect x="30" y="76" width="220" height="75" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="140.0" y="108.5" font-size="16" text-anchor="middle" fill="#20343b">Intent + operating modes</text><text x="140.0" y="130.5" font-size="16" text-anchor="middle" fill="#20343b">PDK + required metrics</text><line x1="250" y1="112" x2="292" y2="112" stroke="#20343b" stroke-width="2"/><polygon points="292.0,112.0 283.0,116.3 283.0,107.7" fill="#20343b"/><rect x="295" y="76" width="210" height="75" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="400.0" y="108.5" font-size="16" text-anchor="middle" fill="#20343b">Generate candidates</text><text x="400.0" y="130.5" font-size="16" text-anchor="middle" fill="#20343b">place + route + repair</text><line x1="505" y1="112" x2="545" y2="112" stroke="#20343b" stroke-width="2"/><polygon points="545.0,112.0 536.0,116.3 536.0,107.7" fill="#20343b"/><rect x="548" y="76" width="220" height="75" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="658.0" y="108.5" font-size="16" text-anchor="middle" fill="#20343b">Physical checks</text><text x="658.0" y="130.5" font-size="16" text-anchor="middle" fill="#20343b">connectivity + coverage</text><line x1="658" y1="151" x2="658" y2="209" stroke="#20343b" stroke-width="2"/><polygon points="658.0,209.0 653.7,200.0 662.3,200.0" fill="#20343b"/><rect x="548" y="211" width="220" height="75" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="658.0" y="243.5" font-size="16" text-anchor="middle" fill="#20343b">Extract + simulate</text><text x="658.0" y="265.5" font-size="16" text-anchor="middle" fill="#20343b">corners / variation</text><line x1="548" y1="249" x2="506" y2="249" stroke="#20343b" stroke-width="2"/><polygon points="506.0,249.0 515.0,244.7 515.0,253.3" fill="#20343b"/><rect x="285" y="211" width="220" height="75" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="395.0" y="243.5" font-size="16" text-anchor="middle" fill="#20343b">Feasible alternatives</text><text x="395.0" y="265.5" font-size="16" text-anchor="middle" fill="#20343b">area / power / margins</text><line x1="285" y1="249" x2="245" y2="249" stroke="#20343b" stroke-width="2"/><polygon points="245.0,249.0 254.0,244.7 254.0,253.3" fill="#20343b"/><rect x="30" y="211" width="212" height="75" fill="#ffe6ad" stroke="#20343b" stroke-width="1.5"/><text x="136.0" y="243.5" font-size="16" text-anchor="middle" fill="#20343b">Selected layout</text><text x="136.0" y="265.5" font-size="16" text-anchor="middle" fill="#20343b">with evidence</text><text x="30" y="340" font-size="18" text-anchor="start" fill="#20343b">A low proxy cost does not establish circuit feasibility.</text><text x="30" y="374" font-size="17" text-anchor="start" fill="#20343b">Unknown coverage or missing models remain visible in the result.</text></svg>
