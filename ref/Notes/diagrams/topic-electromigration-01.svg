<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="em-neck-title"><title id="em-neck-title">Wide route with a narrow neck</title><desc>A wide metal route narrows in its center. The same branch current passes through all three sections. The neck has greater average density and its corners can have further local crowding.</desc><rect x="10" y="10" width="780" height="330" rx="12" fill="#f7fafc" stroke="#cbd5df"/><text x="32" y="43" font-size="20" fill="#17314a">Same branch current through every series section</text><rect x="60" y="105" width="255" height="115" fill="#bcd8ef" stroke="#32658e" stroke-width="2"/><rect x="315" y="145" width="170" height="35" fill="#e5a883" stroke="#a75431" stroke-width="2"/><rect x="485" y="105" width="255" height="115" fill="#bcd8ef" stroke="#32658e" stroke-width="2"/><rect x="313" y="144" width="16" height="37" fill="#c55c48"/><rect x="471" y="144" width="16" height="37" fill="#c55c48"/><text x="135" y="168" font-size="21" fill="#17314a">wide metal</text><text x="551" y="168" font-size="21" fill="#17314a">wide metal</text><text x="361" y="126" font-size="20" fill="#7b3825">neck</text><text x="50" y="76" font-size="18" fill="#17314a">I →</text><text x="700" y="76" font-size="18" fill="#17314a">I →</text><text x="45" y="262" font-size="17" fill="#17314a">Orange: smaller conducting area. Red: possible local crowding near transitions.</text><text x="45" y="294" font-size="17" fill="#17314a">A wide trunk cannot certify a narrow pin, contact, bend, or via landing.</text><text x="45" y="321" font-size="15" fill="#17314a">Colors indicate mechanisms; they are not a simulated density map.</text></svg>
