<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="topic-rf-fig-3"><title id="topic-rf-fig-3">High-voltage structures are defined by field shaping</title><desc>A schematic MOS cross-section contains a source/body region, channel gate, a long drift region and a separate drain. A field plate overlies part of the drift region, showing why it cannot be treated as ordinary routing fill.</desc><text x="45" y="33" font-family="system-ui, sans-serif" font-size="19" fill="#172033" text-anchor="start">Preserve qualified drift, body, field-plate and isolation geometry</text><rect x="65" y="187" width="665" height="118" rx="0" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="89" y="286" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Substrate / epitaxial stack</text><rect x="116" y="196" width="187" height="67" rx="0" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="160" y="247" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Body</text><rect x="295" y="201" width="362" height="52" rx="0" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="411" y="235" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Drift region</text><rect x="131" y="181" width="62" height="37" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><rect x="648" y="181" width="58" height="37" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><rect x="193" y="164" width="112" height="19" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><rect x="285" y="127" width="231" height="19" rx="0" fill="#d8b4fe" stroke="#334155" stroke-width="2"/><rect x="312" y="149" width="236" height="37" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="367" y="175" font-family="system-ui, sans-serif" font-size="15" fill="#172033" text-anchor="start">Thicker dielectric</text><text x="126" y="157" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Source</text><text x="211" y="146" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Gate</text><text x="645" y="157" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Drain</text><text x="339" y="111" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Qualified field plate</text><text x="82" y="340" font-family="system-ui, sans-serif" font-size="17" fill="#172033" text-anchor="start">Mirroring, merging and metal-over-device changes can alter electric fields.</text></svg>
