<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="power-kelvin-title"><title id="power-kelvin-title">Force and sense paths at a local reference point</title><desc>A thick force path carries load current through resistance to a local load terminal. A separate thin high-impedance sense path connects the same physical terminal to a sense input. The sense path carries negligible load current, while shared package reference effects remain.</desc><rect x="10" y="10" width="780" height="360" rx="12" fill="#f7fafc" stroke="#cbd5df"/><text x="29" y="43" font-size="20" fill="#17314a">Sense the intended physical terminal</text><rect x="44" y="91" width="154" height="71" fill="#d5deea" stroke="#526c89" stroke-width="2"/><text x="68" y="132" font-size="19" fill="#17314a">force source</text><rect x="199" y="116" width="399" height="19" fill="#c4765f"/><rect x="330" y="107" width="104" height="38" fill="#e0b291" stroke="#9c6940" stroke-width="2"/><text x="350" y="132" font-size="17" fill="#593e28">R force</text><rect x="599" y="88" width="150" height="170" fill="#c7dff1" stroke="#32658e" stroke-width="2"/><text x="632" y="157" font-size="21" fill="#17314a">load</text><rect x="585" y="114" width="26" height="25" fill="#31576f"/><rect x="581" y="139" width="10" height="148" fill="#568a72"/><rect x="199" y="277" width="392" height="10" fill="#568a72"/><rect x="44" y="242" width="154" height="72" fill="#d3e4d8" stroke="#527c60" stroke-width="2"/><text x="68" y="285" font-size="18" fill="#17314a">sense input</text><text x="222" y="94" font-size="17" fill="#7a3d2f">load current →</text><text x="241" y="267" font-size="17" fill="#345d47">negligible sense current ←</text><text x="38" y="342" font-size="17" fill="#17314a">A circuit-defined sense path observes the local node beyond the force-path drop.</text></svg>
