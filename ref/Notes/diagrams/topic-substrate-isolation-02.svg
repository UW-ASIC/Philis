<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="substrate-return-title"><title id="substrate-return-title">Guard ring with a shared switching return versus a dedicated quiet path</title><desc>Two plan views show a rectangular guard ring around a victim. In the left view its metal return shares an impedance segment with a noisy block. In the right view the return has a separate path to the defined reference connection, whose package impedance remains part of the model.</desc><rect x="10" y="10" width="780" height="350" rx="12" fill="#f7fafc" stroke="#ccd4df"/><text x="30" y="42" font-size="19" fill="#17314a">Shared segment carries switching current</text><text x="423" y="42" font-size="19" fill="#17314a">Separate path to defined reference</text><g fill="#b9d8c4" stroke="#488766"><rect x="60" y="80" width="220" height="16"/><rect x="60" y="210" width="220" height="16"/><rect x="60" y="96" width="16" height="114"/><rect x="264" y="96" width="16" height="114"/><rect x="455" y="80" width="220" height="16"/><rect x="455" y="210" width="220" height="16"/><rect x="455" y="96" width="16" height="114"/><rect x="659" y="96" width="16" height="114"/></g><g fill="#c8e1f5" stroke="#32668e"><rect x="114" y="120" width="110" height="68"/><rect x="510" y="120" width="110" height="68"/></g><g font-size="19" fill="#17314a"><text x="139" y="160">victim</text><text x="535" y="160">victim</text></g><g fill="#c27360"><rect x="162" y="226" width="14" height="55"/><rect x="40" y="274" width="245" height="14"/><rect x="230" y="245" width="55" height="43"/></g><text x="31" y="320" font-size="16" fill="#7b3c2e">shared R + L → local ground motion</text><g fill="#488766"><rect x="557" y="226" width="14" height="77"/><rect x="557" y="291" width="140" height="12"/></g><rect x="645" y="245" width="60" height="35" fill="#c27360"/><text x="700" y="299" font-size="16" fill="#17314a">ref</text><text x="424" y="331" font-size="16" fill="#17314a">Model external R + L and reference noise too.</text><text x="215" y="240" font-size="14" fill="#7b3c2e">noisy block</text><text x="645" y="238" font-size="14" fill="#7b3c2e">noisy block</text></svg>
