<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="topic-rf-fig-2"><title id="topic-rf-fig-2">Distributed collection changes the effective metal resistance</title><desc>A blue metal finger feeds six parallel green silicon conductances to a low-resistance return. Current in the finger decreases with distance from its terminal because some current leaves through each branch.</desc><text x="45" y="32" font-family="system-ui, sans-serif" font-size="19" fill="#172033" text-anchor="start">A uniformly loaded finger differs from a wire feeding one far-end load</text><rect x="102" y="90" width="585" height="24" rx="0" fill="#93c5fd" stroke="#334155" stroke-width="2"/><text x="95" y="73" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">External terminal</text><text x="575" y="73" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Open finger end</text><line x1="52" y1="102" x2="102" y2="102" stroke="#2563eb" stroke-width="10"/><line x1="152" y1="114" x2="152" y2="164" stroke="#2563eb" stroke-width="4"/><line x1="248" y1="114" x2="248" y2="164" stroke="#2563eb" stroke-width="4"/><line x1="344" y1="114" x2="344" y2="164" stroke="#2563eb" stroke-width="4"/><line x1="440" y1="114" x2="440" y2="164" stroke="#2563eb" stroke-width="4"/><line x1="536" y1="114" x2="536" y2="164" stroke="#2563eb" stroke-width="4"/><line x1="632" y1="114" x2="632" y2="164" stroke="#2563eb" stroke-width="4"/><rect x="128" y="164" width="48" height="57" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><rect x="224" y="164" width="48" height="57" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><rect x="320" y="164" width="48" height="57" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><rect x="416" y="164" width="48" height="57" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><rect x="512" y="164" width="48" height="57" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><rect x="608" y="164" width="48" height="57" rx="0" fill="#86efac" stroke="#334155" stroke-width="2"/><line x1="152" y1="221" x2="152" y2="266" stroke="#475569" stroke-width="4"/><line x1="248" y1="221" x2="248" y2="266" stroke="#475569" stroke-width="4"/><line x1="344" y1="221" x2="344" y2="266" stroke="#475569" stroke-width="4"/><line x1="440" y1="221" x2="440" y2="266" stroke="#475569" stroke-width="4"/><line x1="536" y1="221" x2="536" y2="266" stroke="#475569" stroke-width="4"/><line x1="632" y1="221" x2="632" y2="266" stroke="#475569" stroke-width="4"/><line x1="104" y1="266" x2="686" y2="266" stroke="#475569" stroke-width="10"/><text x="220" y="59" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Current decreases along the collection metal</text><text x="285" y="301" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Distributed silicon conductance</text><text x="90" y="332" font-family="system-ui, sans-serif" font-size="16" fill="#172033" text-anchor="start">Blue: finite metal resistance   Green: local silicon   Gray: return</text><text x="70" y="368" font-family="system-ui, sans-serif" font-size="17" fill="#172033" text-anchor="start">For approximately uniform branch current: effective Rmetal ≈ Rwire / 3</text></svg>
