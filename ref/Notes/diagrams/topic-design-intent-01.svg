<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="root-intent-blocks-title" aria-describedby="root-intent-blocks-desc" font-family="system-ui, sans-serif"><title id="root-intent-blocks-title">Preserve identity from schematic devices to physical units</title><desc id="root-intent-blocks-desc">Two device owners map into an ABBA macro. Internal unit positions, terminals and weights remain available after merging.</desc><text x="24" y="32" font-size="20" text-anchor="start" fill="#20343b">Preserve identity from schematic devices to physical units</text><rect x="35" y="85" width="155" height="70" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="112.5" y="115.0" font-size="16" text-anchor="middle" fill="#20343b">Device A</text><text x="112.5" y="137.0" font-size="16" text-anchor="middle" fill="#20343b">G, D, S, B</text><rect x="35" y="202" width="155" height="70" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="112.5" y="232.0" font-size="16" text-anchor="middle" fill="#20343b">Device B</text><text x="112.5" y="254.0" font-size="16" text-anchor="middle" fill="#20343b">G, D, S, B</text><line x1="190" y1="121" x2="252" y2="121" stroke="#20343b" stroke-width="2"/><polygon points="252.0,121.0 243.0,125.3 243.0,116.7" fill="#20343b"/><line x1="190" y1="237" x2="252" y2="237" stroke="#20343b" stroke-width="2"/><polygon points="252.0,237.0 243.0,241.3 243.0,232.7" fill="#20343b"/><rect x="258" y="73" width="495" height="223" fill="#fafbf8" stroke="#20343b" stroke-width="1.5"/><text x="278" y="102" font-size="18" text-anchor="start" fill="#20343b">Macro outline ≠ electrical member geometry</text><rect x="320" y="146" width="77" height="77" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="358.5" y="190.5" font-size="18" text-anchor="middle" fill="#20343b">A</text><rect x="400" y="146" width="77" height="77" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="438.5" y="190.5" font-size="18" text-anchor="middle" fill="#20343b">B</text><rect x="480" y="146" width="77" height="77" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="518.5" y="190.5" font-size="18" text-anchor="middle" fill="#20343b">B</text><rect x="560" y="146" width="77" height="77" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="598.5" y="190.5" font-size="18" text-anchor="middle" fill="#20343b">A</text><text x="290" y="264" font-size="17" text-anchor="start" fill="#20343b">Each unit keeps owner + terminals + weight</text><text x="35" y="342" font-size="17" text-anchor="start" fill="#20343b">A halo or outline change must not move the active-area centroid.</text><text x="35" y="376" font-size="17" text-anchor="start" fill="#20343b">Sharing diffusion is legal only when the actual terminal nets agree.</text></svg>
