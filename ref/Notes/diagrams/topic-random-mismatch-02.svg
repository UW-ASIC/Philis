<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="random-field-title"><title id="random-field-title">Local fluctuations and a shared spatial gradient are different fields</title><desc>A row of rectangular devices sees independent local variation within a background that increases from left to right. Interleaving equal-weight groups can equalize their sample of a linear gradient, while local variation remains.</desc><rect x="10" y="10" width="780" height="340" rx="12" fill="#f7fafc" stroke="#ccd4df"/><text x="30" y="42" font-size="20" fill="#17314a">Shared field increases from left to right</text><g stroke="#d7dbe0"><rect x="40" y="65" width="170" height="190" fill="#edf0fa"/><rect x="210" y="65" width="170" height="190" fill="#dddff3"/><rect x="380" y="65" width="170" height="190" fill="#c9c9e7"/><rect x="550" y="65" width="170" height="190" fill="#b4b2da"/></g><g stroke-width="3"><rect x="65" y="105" width="110" height="95" fill="#c8e4fa" stroke="#27618c"/><rect x="240" y="105" width="110" height="95" fill="#ffe3b5" stroke="#956323"/><rect x="410" y="105" width="110" height="95" fill="#ffe3b5" stroke="#956323"/><rect x="585" y="105" width="110" height="95" fill="#c8e4fa" stroke="#27618c"/></g><g font-size="24" fill="#17314a"><text x="107" y="150">A</text><text x="281" y="150">B</text><text x="451" y="150">B</text><text x="627" y="150">A</text></g><g font-size="15" fill="#17314a"><text x="86" y="178">local δ₁</text><text x="260" y="178">local δ₂</text><text x="430" y="178">local δ₃</text><text x="605" y="178">local δ₄</text></g><text x="40" y="287" font-size="17" fill="#17314a">Equal-weight A and B centroids coincide: linear shared-field error cancels.</text><text x="40" y="321" font-size="17" fill="#17314a">Independent local fluctuations remain; nonlinear fields require more analysis.</text></svg>
