<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="root-matching-patterns-title" aria-describedby="root-matching-patterns-desc" font-family="system-ui, sans-serif"><title id="root-matching-patterns-title">Equal first moments do not imply equal higher moments</title><desc id="root-matching-patterns-desc">Three equal-pitch patterns compare clustered AABB, ABBA and two rows ABBA/BAAB. Their first and second x moments differ as stated.</desc><text x="24" y="32" font-size="20" text-anchor="start" fill="#20343b">Equal first moments do not imply equal higher moments</text><rect x="45" y="84" width="52" height="52" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="71.0" y="116.0" font-size="18" text-anchor="middle" fill="#20343b">A</text><rect x="100" y="84" width="52" height="52" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="126.0" y="116.0" font-size="18" text-anchor="middle" fill="#20343b">A</text><rect x="155" y="84" width="52" height="52" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="181.0" y="116.0" font-size="18" text-anchor="middle" fill="#20343b">B</text><rect x="210" y="84" width="52" height="52" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="236.0" y="116.0" font-size="18" text-anchor="middle" fill="#20343b">B</text><text x="292" y="112" font-size="18" text-anchor="start" fill="#20343b">AABB: ΔMx = −2 pitch units</text><text x="292" y="143" font-size="16" text-anchor="start" fill="#20343b">A and B sample different mean positions.</text><rect x="45" y="189" width="52" height="52" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="71.0" y="221.0" font-size="18" text-anchor="middle" fill="#20343b">A</text><rect x="100" y="189" width="52" height="52" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="126.0" y="221.0" font-size="18" text-anchor="middle" fill="#20343b">B</text><rect x="155" y="189" width="52" height="52" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="181.0" y="221.0" font-size="18" text-anchor="middle" fill="#20343b">B</text><rect x="210" y="189" width="52" height="52" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="236.0" y="221.0" font-size="18" text-anchor="middle" fill="#20343b">A</text><text x="292" y="219" font-size="18" text-anchor="start" fill="#20343b">ABBA: ΔMx = 0; ΔMx² = 2</text><text x="292" y="250" font-size="16" text-anchor="start" fill="#20343b">Linear x cancels; quadratic x² remains.</text><rect x="45" y="297" width="52" height="52" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="71.0" y="329.0" font-size="18" text-anchor="middle" fill="#20343b">A</text><rect x="100" y="297" width="52" height="52" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="126.0" y="329.0" font-size="18" text-anchor="middle" fill="#20343b">B</text><rect x="155" y="297" width="52" height="52" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="181.0" y="329.0" font-size="18" text-anchor="middle" fill="#20343b">B</text><rect x="210" y="297" width="52" height="52" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="236.0" y="329.0" font-size="18" text-anchor="middle" fill="#20343b">A</text><rect x="45" y="352" width="52" height="52" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="71.0" y="384.0" font-size="18" text-anchor="middle" fill="#20343b">B</text><rect x="100" y="352" width="52" height="52" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="126.0" y="384.0" font-size="18" text-anchor="middle" fill="#20343b">A</text><rect x="155" y="352" width="52" height="52" fill="#d7efe4" stroke="#20343b" stroke-width="1.5"/><text x="181.0" y="384.0" font-size="18" text-anchor="middle" fill="#20343b">A</text><rect x="210" y="352" width="52" height="52" fill="#dce8fb" stroke="#20343b" stroke-width="1.5"/><text x="236.0" y="384.0" font-size="18" text-anchor="middle" fill="#20343b">B</text><text x="292" y="328" font-size="18" text-anchor="start" fill="#20343b">Two balanced rows:</text><text x="292" y="359" font-size="16" text-anchor="start" fill="#20343b">ΔMx = ΔMy = ΔMx² = ΔMxy = ΔMy² = 0</text><text x="292" y="392" font-size="16" text-anchor="start" fill="#20343b">Equal weights; centered, equal-pitch grid.</text></svg>
