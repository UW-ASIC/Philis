<svg font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="power-branch-title"><title id="power-branch-title">Supply trunk current equals the sum of downstream load currents</title><desc>A rectangular supply pad feeds a trunk that splits into three load branches carrying 2, 1, and 0.5 milliamperes. The trunk before the split carries 3.5 milliamperes. Branch labels show why one net-wide width is insufficient.</desc><rect x="10" y="10" width="780" height="370" rx="12" fill="#f7fafc" stroke="#cbd5df"/><text x="28" y="43" font-size="20" fill="#17314a">One net, several physical branch demands</text><rect x="43" y="145" width="100" height="83" fill="#d5deea" stroke="#526c89" stroke-width="2"/><text x="65" y="191" font-size="21" fill="#17314a">pad</text><rect x="144" y="174" width="228" height="24" fill="#c4765f"/><rect x="357" y="90" width="24" height="220" fill="#c4765f"/><rect x="381" y="91" width="235" height="18" fill="#c4765f"/><rect x="381" y="179" width="235" height="14" fill="#c4765f"/><rect x="381" y="293" width="235" height="10" fill="#c4765f"/><g fill="#c7dff1" stroke="#32658e" stroke-width="2"><rect x="615" y="67" width="133" height="66"/><rect x="615" y="153" width="133" height="66"/><rect x="615" y="267" width="133" height="66"/></g><g font-size="18" fill="#17314a"><text x="650" y="106">load A</text><text x="650" y="192">load B</text><text x="650" y="306">load C</text><text x="193" y="158">3.5 mA →</text><text x="456" y="80">2 mA →</text><text x="456" y="165">1 mA →</text><text x="442" y="281">0.5 mA →</text></g><text x="32" y="354" font-size="17" fill="#17314a">Red: supply metal. The return network carries corresponding currents and also drops voltage.</text></svg>
