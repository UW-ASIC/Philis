[package]
name = "pnr-visualizer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "pnr_visualizer"

[features]
probe = ["dep:gdsverify"]

[dependencies]
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
earcutr = "0.4"
env_logger = "0.11"
log = "0.4"
serde_json = "1"
gdsverify = { workspace = true, optional = true }
