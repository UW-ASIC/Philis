[package]
name = "benchmark"
version = "0.1.0"
edition = "2021"

[features]
default = []
# `cargo run --release -p benchmark --features gpu` — GPU DRC/ERC, devshell only.
gpu = ["library/gpu", "verify/gpu"]

[dependencies]
library = { path = "../frontend/library" }
verify = { path = "../backend/verify" }
annotator = { path = "../backend/annotator" }
pnr_core = { path = "../kernel/core" }
serde_json = "1"

[[bin]]
name = "bench"
path = "src/bench.rs"

[[bin]]
name = "gds2svg"
path = "src/gds2svg.rs"
