[package]
name = "benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
library = { path = "../frontend/library" }
verify = { path = "../backend/verify" }
annotator = { path = "../backend/annotator" }
pnr_core = { path = "../kernel/core" }
serde_json = "1"

[dev-dependencies]
# `examples/net_dump` reads the extraction tables directly.
gdsverify = { workspace = true }

[[bin]]
name = "bench"
path = "src/bench.rs"

[[bin]]
name = "gds2svg"
path = "src/gds2svg.rs"
